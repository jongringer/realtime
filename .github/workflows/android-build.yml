name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: Node.js 22 설정
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: JDK 21 설정
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: gradle

    - name: 의존성 설치 및 웹 자산 빌드
      run: |
        npm ci || npm install
        npm run build

    - name: Capacitor 안드로이드 동기화
      run: |
        npx cap sync android

    - name: Gradle 실행 권한 부여
      run: |
        chmod +x android/gradlew

    - name: 디버그 APK 빌드
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: APK 파일 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7
