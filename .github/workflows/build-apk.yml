name: Build and Release Signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Core Shift Logic & OCR Unit Tests
        run: |
          npm test

      - name: Sync Capacitor to Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Unsigned Release APK with Gradle
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Sign Android Release APK with apksigner
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out ./ShiftAlarm-${{ github.ref_name }}.apk \
            "$UNSIGNED_APK"
          $BUILD_TOOLS_DIR/apksigner verify --verbose ./ShiftAlarm-${{ github.ref_name }}.apk
          echo "✓ 정식 서명 완료: ./ShiftAlarm-${{ github.ref_name }}.apk"

      - name: Publish Signed APK to GitHub Release with QR Code
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "근무표 알람 앱 ${{ github.ref_name }} (정식 서명판)"
          body: |
            ### 📱 정식 서명 릴리스 (${{ github.ref_name }})
            - **서명 상태**: Release Keystore 정식 서명 완료 (SHA-256 / RSA)
            - **배포 기준 커밋**: ${{ github.sha }}

            ---

            ### 📲 스마트폰 카메라로 QR 코드를 스캔하세요 (또는 이미지 터치)
            > 스마트폰 기본 카메라 앱으로 아래 QR 코드를 비추거나, 이미지를 직접 터치하면 바로 최신 앱이 다운로드됩니다.

            [![Download QR Code](https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ShiftAlarm-${{ github.ref_name }}.apk)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ShiftAlarm-${{ github.ref_name }}.apk)

            - **📥 APK 직접 다운로드 주소 (클릭 시 다운로드)**:  
              [https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ShiftAlarm-${{ github.ref_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ShiftAlarm-${{ github.ref_name }}.apk)
            - **⚡ Surge 미러 다운로드 주소**:  
              [https://kbs-4shift-5855.surge.sh/ShiftAlarm.apk](https://kbs-4shift-5855.surge.sh/ShiftAlarm.apk)

            ---

            ### 🌐 실시간 공개 웹앱 바로가기 (설치 없이 브라우저로 열기)
            - ⚡ **Surge 상시 웹앱 (추천)**: [https://kbs-4shift-5855.surge.sh](https://kbs-4shift-5855.surge.sh)
            - 🔗 **GitHub Pages 웹앱**: [https://jongringer.github.io/shiftalarm/](https://jongringer.github.io/shiftalarm/)
          draft: false
          prerelease: false
          files: ./ShiftAlarm-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Deploy Signed APK to Surge.sh Cloud
        run: |
          mkdir -p dist
          cp ./ShiftAlarm-${{ github.ref_name }}.apk ./dist/ShiftAlarm.apk
          node build.js
          npx surge ./dist kbs-4shift-5855.surge.sh --token "${{ secrets.SURGE_TOKEN || '81c2062b09ea41b4d328d2d5c79c910a' }}"
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN || 'kbs_shift_1634@shiftwork.app' }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || '81c2062b09ea41b4d328d2d5c79c910a' }}

