    function increaseTimeFontSize(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const maxBoost = 10;
      const step = 2;
      let current = parseInt(localStorage.getItem('transit_time_font_boost') || '0', 10);
      if (isNaN(current) || current < 0) current = 0;
      let next = current + step;
      if (next > maxBoost) {
        showTimeZoomToast('도착시간 글씨가 최대 크기입니다');
        return;
      }
      setTimeFontBoost(next);
      showTimeZoomToast(`도착시간 글씨 확대 (+${next}px)`);
    }
    window.increaseTimeFontSize = increaseTimeFontSize;

    function resetTimeFontSize(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      setTimeFontBoost(0);
      showTimeZoomToast('도착시간 글씨 기본 크기로 복귀');
    }
    window.resetTimeFontSize = resetTimeFontSize;

    function setTimeFontBoost(boostPx) {
      try {
        localStorage.setItem('transit_time_font_boost', String(boostPx));
      } catch (e) {}
      document.documentElement.style.setProperty('--time-font-boost', `${boostPx}px`);
    }

    function initTimeFontBoost() {
      try {
        const saved = parseInt(localStorage.getItem('transit_time_font_boost') || '0', 10);
        const boost = (!isNaN(saved) && saved >= 0 && saved <= 10) ? saved : 0;
        document.documentElement.style.setProperty('--time-font-boost', `${boost}px`);
      } catch (e) {}
    }

    let _zoomToastTimer = null;
    function showTimeZoomToast(msg) {
      let toast = document.getElementById('transit-zoom-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'transit-zoom-toast';
        toast.className = 'transit-zoom-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(_zoomToastTimer);
      _zoomToastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 1200);
    }
    initTimeFontBoost();

    function getRouteHeadwaySec(routeNum, now) {
      const isHoliday = (typeof isWeekendOrHoliday === 'function') ? isWeekendOrHoliday(now) : false;
      if (routeNum === '양천01') {
        if (isHoliday) return 600; // 주말·공휴일 10분 (약 8~12분)
        const h = now.getHours();
        const m = now.getMinutes();
        const hm = h * 60 + m;
        const isRush = (hm >= 7 * 60 && hm <= 9 * 60 + 30) || (hm >= 17 * 60 + 30 && hm <= 20 * 60);
        return isRush ? 360 : 450; // 평일 출퇴근 혼잡 6분(5~8분), 평시 7.5분
      }
      if (routeNum === '603') return isHoliday ? 780 : 660; // 13분 / 11분
      if (routeNum === '6620') return isHoliday ? 960 : 780; // 16분 / 13분
      return 600;
    }

    const BUS_CONFIGS = {

      }

    const busCache = {};

    function formatSec(sec) {
      if (sec <= 0) return '<span class="transit-time-arrive transit-time-arrive-big" style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>';
      if (sec < 60) return `<span style="color:#dc2626; font-weight:900;">${sec}초 후</span>`;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const sStr = s < 10 ? '0' + s : s;
      return `<span class="transit-time-min">${m}분</span> <span class="transit-time-sec">${sStr}초 후</span>`;
    }

    function formatPlateWithBigDigits(plate, icon = '🚌') {
      if (!plate) return '';
      const str = String(plate).trim();
      const m = str.match(/^(.*?)(\d{4})$/);
      if (m) {
        const prefix = m[1] ? `${m[1]} ` : '';
        return `${icon} ${prefix}<strong class="plate-digit-highlight" style="font-size:14.5px; font-weight:900; letter-spacing:0.5px; margin-left:1px;">${m[2]}</strong>`;
      }
      return `${icon} ${str}`;
    }

    function formatPlateSmall(plate) {
      if (!plate) return '';
      const str = String(plate).trim();
      const m = str.match(/^(.*?)(\d{4})$/);
      if (m) {
        const prefix = m[1] ? `${m[1]} ` : '';
        return `${prefix}<strong style="font-size:12px; font-weight:800;">${m[2]}</strong>`;
      }
      return str;
    }

    async function fetchSeoulBusArrival(busRouteId, stId, ord) {
      const cacheKey = `${busRouteId}_${stId}_${ord}`;
      const directUrl = `http://ws.bus.go.kr/api/rest/arrive/getArrInfoByRoute?serviceKey=${SEOUL_BUS_KEY}&busRouteId=${busRouteId}&stId=${stId}&ord=${ord}&resultType=json`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          const item = data?.msgBody?.itemList?.[0];
          if (item) {
            busCache[cacheKey] = item;
            return item;
          }
        }
      } catch (e) {}

      const proxies = [
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const item = data?.msgBody?.itemList?.[0];
            if (item) {
              busCache[cacheKey] = item;
              return item;
            }
          }
        } catch (err) {}
      }

      return busCache[cacheKey] || null;
    }

    async function fetchSeoulSubwayArrival(stationName) {
      const cacheKey = stationName;
      const directUrl = `http://swopenAPI.seoul.go.kr/api/subway/${SEOUL_SUBWAY_KEY}/json/realtimeStationArrival/0/10/${encodeURIComponent(stationName)}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          if (data && data.realtimeArrivalList) {
            subwayCache[cacheKey] = data.realtimeArrivalList;
            return data.realtimeArrivalList;
          }
        }
      } catch (e) {}

      const proxies = [
        url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            if (data && data.realtimeArrivalList) {
              subwayCache[cacheKey] = data.realtimeArrivalList;
              return data.realtimeArrivalList;
            }
          }
        } catch (err) {}
      }

      return subwayCache[cacheKey] || null;
    }

    function parseSeoulBus(routeConfig, busItem, now, nowMs) {
      const dynamicHeadway = getRouteHeadwaySec(routeConfig.routeNum, now);
      const headway = dynamicHeadway || routeConfig.headway || 420;
      const targetOrd = parseInt(routeConfig.ord, 10);
      let next = null;
      let next2 = null;
      let next3 = null;

      if (busItem) {
        const traTime1 = parseInt(busItem.traTime1 || '0', 10);
        const sectOrd1 = parseInt(busItem.sectOrd1 || '0', 10);
        const arrmsg1 = (busItem.arrmsg1 || '').trim();
        const plainNo1 = (busItem.plainNo1 || '').trim();

        const traTime2 = parseInt(busItem.traTime2 || '0', 10);
        const sectOrd2 = parseInt(busItem.sectOrd2 || '0', 10);
        const arrmsg2 = (busItem.arrmsg2 || '').trim();
        const plainNo2 = (busItem.plainNo2 || '').trim();

        let stop1Text = '';
        const m1 = arrmsg1.match(/\[(\d+)번째\s*전\]/);
        if (m1) stop1Text = `[${m1[1]}번째 전]`;
        else if (sectOrd1 > 0 && targetOrd > sectOrd1) stop1Text = `[${targetOrd - sectOrd1}번째 전]`;

        const isArrivingSoon1 = arrmsg1.includes('곧 도착');
        const isWait1 = arrmsg1.includes('출발대기');
        const isEnd1 = arrmsg1.includes('운행종료');

        let sec1 = traTime1;
        if (isArrivingSoon1) sec1 = Math.min(sec1 > 0 ? sec1 : 30, 45);

        next = {
          sec: sec1,
          arrmsg: arrmsg1,
          stopText: stop1Text,
          plainNo: plainNo1,
          isArrivingSoon: isArrivingSoon1,
          isWait: isWait1,
          isEnd: isEnd1,
          targetTime: (sec1 > 0) ? (nowMs + sec1 * 1000) : null
        };

        let stop2Text = '';
        const m2 = arrmsg2.match(/\[(\d+)번째\s*전\]/);
        if (m2) stop2Text = `[${m2[1]}번째 전]`;
        else if (sectOrd2 > 0 && targetOrd > sectOrd2) stop2Text = `[${targetOrd - sectOrd2}번째 전]`;

        const isWait2 = arrmsg2.includes('출발대기');
        const isEnd2 = arrmsg2.includes('운행종료');
        const isArrivingSoon2 = arrmsg2.includes('곧 도착');

        if (traTime2 > 0 || isWait2 || isArrivingSoon2) {
          let sec2 = traTime2;
          if (isArrivingSoon2) sec2 = Math.min(sec2 > 0 ? sec2 : 45, 60);

          next2 = {
            sec: sec2,
            arrmsg: arrmsg2,
            stopText: stop2Text,
            plainNo: plainNo2,
            isWait: isWait2,
            isEnd: isEnd2,
            targetTime: (sec2 > 0) ? (nowMs + sec2 * 1000) : null
          };
        } else if (sec1 > 0 && !isWait1 && !isEnd1) {
          const next2Sec = sec1 + headway;
          next2 = {
            sec: next2Sec,
            arrmsg: '배차 간격 운행',
            stopText: '차기 순번',
            plainNo: '',
            isWait: false,
            isEnd: false,
            targetTime: nowMs + next2Sec * 1000
          };
        }
      }

      if (!next) {
        const curSecInHour = now.getMinutes() * 60 + now.getSeconds();
        const cycleOffset = headway - (curSecInHour % headway);
        next = {
          sec: cycleOffset,
          arrmsg: '정규 배차순번',
          stopText: '정규 배차',
          plainNo: '',
          isArrivingSoon: false,
          isWait: false,
          isEnd: false,
          targetTime: nowMs + cycleOffset * 1000
        };
        const next2Sec = cycleOffset + headway;
        next2 = {
          sec: next2Sec,
          arrmsg: '차기 배차순번',
          stopText: '차기 순번',
          plainNo: '',
          isWait: false,
          isEnd: false,
          targetTime: nowMs + next2Sec * 1000
        };
      }

      // 양천01의 경우 사용자 요청에 따라 다다다음(next3)까지 계산 투영 (평일 5~8분 / 주말 8~12분 배차)
      if (routeConfig.routeNum === '양천01') {
        const baseTargetMs = (next2 && next2.targetTime) ? next2.targetTime : (next.targetTime ? next.targetTime + headway * 1000 : nowMs + headway * 2000);
        const next3TargetMs = baseTargetMs + headway * 1000;
        const next3Sec = Math.max(1, Math.round((next3TargetMs - nowMs) / 1000));
        const d3 = new Date(next3TargetMs);
        const clock3 = `${String(d3.getHours()).padStart(2, '0')}:${String(d3.getMinutes()).padStart(2, '0')}`;
        next3 = {
          sec: next3Sec,
          targetTime: next3TargetMs,
          clockStr: clock3,
          arrmsg: '다다다음 순번',
          stopText: '차기 배차'
        };
      }

      // 사용자 요청: 출퇴근 시간에 버스 시간표에 연동되던 것을 중지하고 버스 번호로 실시간 도착정보를 최우선 수신
      // 실시간 데이터가 없는 경우(심야 등)에만 시간표 보조 활용
      if (next && next.isEstimate) {
        const prioritySchedule = (typeof getPriorityBusSchedule === 'function')
          ? getPriorityBusSchedule(routeConfig.routeNum, (routeConfig.stId === '114000052' || routeConfig.arsId === '15-154') ? '15154' : '', now)
          : null;

        if (prioritySchedule && prioritySchedule.next) {
          const pNext = prioritySchedule.next;
          const pNext2 = prioritySchedule.next2;

          const isImminent = pNext.diffSec <= 35;
          const livePlate1 = (busItem && busItem.plainNo1) ? busItem.plainNo1 : '';

          next = {
            sec: pNext.diffSec,
            rawSec: pNext.diffSec,
            arrmsg: `${pNext.time} 정시운행`,
            stopText: isImminent ? '정류소 진입 중' : `정시 시간표 (${prioritySchedule.periodName})`,
            plainNo: livePlate1,
            isArrivingSoon: isImminent,
            isWait: false,
            isEnd: false,
            targetTime: pNext.targetTime,
            isPriority: true,
            priorityTime: pNext.time,
            periodName: prioritySchedule.periodName
          };

          if (pNext2) {
            const livePlate2 = (busItem && busItem.plainNo2) ? busItem.plainNo2 : '';
            next2 = {
              sec: pNext2.diffSec,
              rawSec: pNext2.diffSec,
              arrmsg: `${pNext2.time} 정시운행`,
              stopText: `차기 순번 (${pNext2.time})`,
              plainNo: livePlate2,
              isWait: false,
              isEnd: false,
              targetTime: pNext2.targetTime,
              isPriority: true,
              priorityTime: pNext2.time
            };
          }
        }
      }

      return { next, next2, next3 };
    }

    /**
     * 실시간 서울시 지하철(9호선 일반열차) 데이터 파싱 및 UI 변환
     */
    function parseRealtimeSubwayArrival(stationName, updnLine, rawList, now, nowMs) {
      if (!rawList || !Array.isArray(rawList)) return null;

      // 9호선(subwayId 1009) & 일반열차 & 해당 방향(상행/하행)
      const filtered = rawList.filter(item => {
        if (item.subwayId !== '1009') return false;
        const isNormal = (item.btrainSttus === '일반' || !item.btrainSttus || item.btrainSttus === '0');
        const isDir = (item.updnLine === updnLine);
        return isNormal && isDir;
      });

      if (filtered.length === 0) return null;

      // barvlDt (도착 예정 초) 오름차순 정렬
      filtered.sort((a, b) => {
        const secA = parseInt(a.barvlDt || '0', 10);
        const secB = parseInt(b.barvlDt || '0', 10);
        return secA - secB;
      });

      const formatTrain = (item) => {
        const rawSeconds = parseInt(item.barvlDt || '0', 10);
        const trainNo = (item.btrainNo || '').trim();
        const dest = item.bstatnNm || (updnLine === '상행' ? '중앙보훈병원' : '개화');
        const curLoc = item.arvlMsg3 ? `[${item.arvlMsg3}]` : '';
        const statusMsg = (item.arvlMsg2 || '').trim();

        // 진입(0)/도착(1)이거나 메시지에 진입/도착 포함 또는 35초 이하 시 '곧 도착' 처리
        const isArrivingSoon = (item.arvlCd === '0' || item.arvlCd === '1') ||
          statusMsg.includes('도착') || statusMsg.includes('진입') ||
          (rawSeconds > 0 && rawSeconds <= 35);

        let displayEta = "";
        if (isArrivingSoon) {
          displayEta = "⚡ 곧 도착";
        } else {
          const min = Math.floor(rawSeconds / 60);
          const secRem = rawSeconds % 60;
          displayEta = min === 0 ? `${secRem}초 후` : `${min}분 ${secRem}초 후`;
        }

        let sec = rawSeconds;
        if (isArrivingSoon && sec <= 0) sec = 25;
        else if (sec <= 0) sec = 45;

        const targetTime = nowMs + sec * 1000;
        const dt = new Date(targetTime);
        const clockStr = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;

        return {
          sec: sec,
          rawSec: rawSeconds,
          displayEta: displayEta,
          trainNo: trainNo,
          destName: dest,
          curLocation: curLoc,
          statusMsg: statusMsg,
          isArrivingSoon: isArrivingSoon,
          targetTime: targetTime,
          clockStr: clockStr,
          isLive: true
        };
      };

      const nextTrain = filtered[0] ? formatTrain(filtered[0]) : null;
      const next2Train = filtered[1] ? formatTrain(filtered[1]) : null;

      return { nextTrain, next2Train };
    }

    function isKoreanHoliday(date) {
      if (typeof window !== 'undefined' && typeof window.isKoreanHoliday === 'function') {
        return window.isKoreanHoliday(date);
      }
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const md = `${m}-${d}`;
      const fixed = ['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];
      return fixed.includes(md);
    }

    function isWeekendOrHoliday(date) {
      const day = date.getDay();
      return day === 0 || day === 6 || isKoreanHoliday(date);
    }

    /**
     * ODsay보다 우선 반영되는 역사 공식 고정 시간표 배차 계산 함수
     */
    function getPrioritizedTrains(now, isCommute, count = 2) {
      const isHoliday = isWeekendOrHoliday(now);
      let schedule;
      let defaultDest;
      let stationName;

      if (isCommute) {
        stationName = '선유도역';
        defaultDest = '중앙보훈병원';
        schedule = isHoliday ? SEONYUDO_WEEKEND : SEONYUDO_WEEKDAY;
      } else {
        stationName = '국회의사당역';
        defaultDest = '개화';
        schedule = isHoliday ? NATIONAL_ASSEMBLY_WEEKEND : NATIONAL_ASSEMBLY_WEEKDAY;
      }

      const rawH = now.getHours();
      // 0시는 지하철 당일 심야 운행 24시로 처리
      const currentH = (rawH === 0) ? 24 : rawH;
      const currentMinutes = currentH * 60 + now.getMinutes();
      const currentSec = now.getSeconds();
      const nowMs = now.getTime();

      const results = [];
      const hours = Object.keys(schedule).map(Number).sort((a, b) => a - b);

      for (const h of hours) {
        const mins = schedule[h];
        for (const m of mins) {
          const trainMin = h * 60 + m;
          const diffSec = (trainMin - currentMinutes) * 60 - currentSec;
          if (diffSec >= -30) {
            let dest = defaultDest;
            if (stationName === '국회의사당역') {
              if (h === 24 && m === 42) {
                dest = '마곡나루(종착)';
              } else if ((h === 24 && m === 53) || (h === 23 && m === 50 && isHoliday)) {
                dest = '염창(종착)';
              }
            } else if (stationName === '선유도역') {
              if (h === 24 && !isHoliday) {
                if (m === 18) dest = '삼전(종착)';
                else if (m === 30) dest = '신논현(종착)';
                else if (m === 43) dest = '동작(종착)';
                else if (m === 56) dest = '당산(종착)';
              } else if (h === 23 && isHoliday) {
                if (m === 27) dest = '신논현(종착)';
                else if (m === 41) dest = '동작(종착)';
                else if (m === 55) dest = '당산(종착)';
              }
            }

            const displayH = (h === 24) ? '00' : String(h).padStart(2, '0');
            const displayM = String(m).padStart(2, '0');

            results.push({
              departureTime: `${displayH}:${displayM}`,
              endStationName: dest,
              sec: Math.max(0, diffSec),
              remainSeconds: Math.max(0, diffSec),
              remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
              targetTime: nowMs + Math.max(0, diffSec) * 1000,
              source: '역고정시간표(우선)',
              subwayClass: 0
            });
            if (results.length >= count) break;
          }
        }
        if (results.length >= count) break;
      }

      // 만약 심야 운행 종료 시간대(01:00 ~ 04:59)라면 당일 아침 첫차 반환
      if (results.length === 0 && (rawH >= 1 && rawH < 5)) {
        const firstH = hours[0];
        const firstM = schedule[firstH][0];
        const displayH = String(firstH).padStart(2, '0');
        const displayM = String(firstM).padStart(2, '0');
        const firstTrainMin = firstH * 60 + firstM;
        const diffSec = (firstTrainMin - (rawH * 60 + now.getMinutes())) * 60 - currentSec;
        results.push({
          departureTime: `${displayH}:${displayM}`,
          endStationName: defaultDest,
          sec: Math.max(0, diffSec),
          remainSeconds: Math.max(0, diffSec),
          remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
          targetTime: nowMs + Math.max(0, diffSec) * 1000,
          source: '역고정시간표(첫차)',
          subwayClass: 0,
          isFirstTrain: true
        });
      }

      return results;
    }

      // 네트워크 호출이 필요한 경우이거나 아직 캐시 데이터가 없는 경우에만 네트워크 호출
      if (fetchNetwork || !busResults || !subwayRaw) {
        const busPromises = config.routes.map(r =>
          fetchSeoulBusArrival(r.busRouteId, r.stId, r.ord).catch(() => null)
        );
        const subwayPromise = fetchSeoulSubwayArrival(subwayTargetStation).catch(() => null);

        const [newBusResults, newSubwayRaw] = await Promise.all([
          Promise.all(busPromises),
          subwayPromise
        ]);

        if (newBusResults) {
          busResults = newBusResults;
          lastBusResults = newBusResults;
        }
        if (newSubwayRaw) {
          subwayRaw = newSubwayRaw;
          lastSubwayRaw = newSubwayRaw;
        }
      }

      const busDataMap = {};
      config.routes.forEach((r, idx) => {
        busDataMap[r.routeNum] = busResults ? busResults[idx] : null;
      });

      const elapsed = Date.now() - startTime;
      if (showLoading && elapsed < 250) {
        await new Promise(r => setTimeout(r, 250 - elapsed));
      }

      const now = new Date();
      const nowMs = now.getTime();

      // 1. 버스 도착 정보 (실시간 차량번호 최우선)
      const busRows = config.routes.map(r => {
        const item = busDataMap[r.routeNum];
        const { next, next2 } = parseSeoulBus(r, item, now, nowMs);

        // 🔴 다음 버스 UI
        let nextTimeHtml = '';
        let nextSubLoc = '';

        if (next.isWait) {
          nextTimeHtml = `<span style="color:#d97706; font-weight:800;">⏸️ 출발대기</span>`;
          nextSubLoc = `상태: <b>기점/차고지 출발대기</b>`;
        } else if (next.isEnd) {
          nextTimeHtml = `<span style="color:#64748b; font-weight:800;">🚫 운행종료</span>`;
          nextSubLoc = `상태: <b>오늘 운행종료</b>`;
        } else if (next.isArrivingSoon || next.sec <= 30) {
          nextTimeHtml = `<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>`;
          const loc = next.stopText ? `${next.stopText} · 진입 중` : '정류소 진입 중';
          nextSubLoc = `위치: <b>${loc}</b>`;
        } else if (next.targetTime) {
          nextTimeHtml = `<span class="live-cd" data-time="${next.targetTime}" style="font-size:13.5px; font-weight:800; white-space:nowrap;">${formatSec(next.sec)}</span>`;
          nextSubLoc = `위치: <b>${next.stopText || '운행 중'}</b>`;
        } else {
          nextTimeHtml = `<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>`;
          nextSubLoc = `위치: <b>운행 중</b>`;
        }

        let nextArrClock = '';
        let nextScheduleBadge = '';
        if (next.isPriority && next.priorityTime) {
          nextArrClock = next.priorityTime;
          nextScheduleBadge = `<span style="display:inline-flex; align-items:center; background:#fef3c7; color:#92400e; font-size:10px; padding:1px 5px; border-radius:4px; font-weight:800; margin-left:4px; border:1px solid #fde68a;">🗓️ 공식 시간표</span>`;
        } else if (next.targetTime && !next.isWait && !next.isEnd) {
          const nextArrTime = new Date(next.targetTime);
          nextArrClock = `${String(nextArrTime.getHours()).padStart(2, '0')}:${String(nextArrTime.getMinutes()).padStart(2, '0')}`;
        }

        const vehicleBadge1 = next.plainNo
          ? `<span class="badge-bus-plate" style="display:inline-flex; align-items:center; background:#f1f5f9; color:#334155; font-size:11px; padding:2px 7px; border-radius:5px; font-weight:700; margin-left:6px; border:1px solid #cbd5e1;">${formatPlateWithBigDigits(next.plainNo, '🚌')}</span>`
          : '';

        const nextHtml = `
          <div class="next-transit-box" style="padding:7px 10px;">
            <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; white-space:nowrap;">
              <span class="next-tag-red" style="font-size:11px; white-space:nowrap;">
                <span>🔴</span> <span>다음 버스</span>
                ${vehicleBadge1}
              </span>
              <span class="next-time-big" style="font-size:13.5px; font-weight:800; white-space:nowrap;">
                ${nextTimeHtml}
              </span>
            </div>
            <div class="next-transit-sub" style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #bae6fd; padding-top:4px; margin-top:4px;">
              <span>${nextSubLoc}</span>
              ${nextArrClock ? `<span class="transit-sub-time"><span class="transit-arr-label" style="font-size:12.5px; font-weight:800;">도착 예정:</span> <b class="transit-clock-time" style="font-size:16px; font-weight:900; color:#0369a1;">${nextArrClock}</b></span>` : ''}
            </div>
          </div>
        `;

        let next2Html = '';
        if (next2) {
          let next2TimeHtml = '';
          let next2SubLoc = '';
          let next2ArrClock = '';
          let next2ScheduleBadge = '';

          if (next2.isWait) {
            next2TimeHtml = `<span class="transit-time-imminent" style="color:#d97706; font-weight:700;">⏸️ 출발대기</span>`;
            next2SubLoc = `상태: <b>기점/차고지 대기</b>`;
          } else if (next2.isEnd) {
            next2TimeHtml = `<span class="transit-time-arrive" style="color:#64748b; font-weight:700;">🚫 운행종료</span>`;
            next2SubLoc = `상태: <b>오늘 운행종료</b>`;
          } else if (next2.isArrivingSoon || next2.sec <= 30) {
            next2TimeHtml = `<span class="transit-time-arrive transit-time-arrive-big" style="color:#dc2626; font-weight:900; font-size:21px;">⚡ 곧 도착</span>`;
            const loc = next2.stopText ? `${next2.stopText} · 진입 중` : '정류소 진입 중';
            next2SubLoc = `위치: <b>${loc}</b>`;
          } else if (next2.targetTime) {
            next2TimeHtml = `<span class="live-cd" data-time="${next2.targetTime}" style="font-weight:900; color:#1e40af; font-size:18.5px;">${formatSec(next2.sec)}</span>`;
            const loc = next2.stopText || '운행 중';
            next2SubLoc = `위치: <b>${loc}</b>`;
          } else {
            next2TimeHtml = `<span class="transit-time-arrive transit-time-arrive-big" style="color:#dc2626; font-weight:900; font-size:21px;">⚡ 곧 도착</span>`;
            next2SubLoc = `위치: <b>운행 중</b>`;
          }

          if (next2.isPriority && next2.priorityTime) {
            next2ArrClock = next2.priorityTime;
            next2ScheduleBadge = `<span class="badge-priority-timetable" style="display:inline-flex; align-items:center; background:#fef3c7; color:#92400e; font-size:10px; padding:1px 5px; border-radius:4px; font-weight:700; margin-left:4px; border:1px solid #fde68a;">[시간표]</span>`;
          } else if (next2.targetTime && !next2.isWait && !next2.isEnd) {
            const next2ArrTime = new Date(next2.targetTime);
            next2ArrClock = `${String(next2ArrTime.getHours()).padStart(2, '0')}:${String(next2ArrTime.getMinutes()).padStart(2, '0')}`;
          }

          const vehicleBadge2 = next2.plainNo
            ? `<span class="badge-bus-plate" style="display:inline-flex; align-items:center; background:#eff6ff; color:#1e40af; font-size:11px; padding:2px 7px; border-radius:5px; font-weight:700; margin-left:6px; border:1px solid #bfdbfe;">${formatPlateWithBigDigits(next2.plainNo, '🚌')}</span>`
            : '';

          next2Html = `
            <div class="next-transit-box next2-transit-box" style="margin-top:5px; padding:7px 10px; background:#f8fafc; border:1.5px solid #bfdbfe; border-radius:8px;">
              <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                <span class="next2-tag-blue" style="color:#1d4ed8; font-weight:900; font-size:11px; display:inline-flex; align-items:center;">
                  <span>🔵</span>
                  <span style="margin-left:3px;">다다음 버스</span>
                  ${vehicleBadge2}
                </span>
                <span class="next-time-big next2-time-big">
                  ${next2TimeHtml}
                </span>
              </div>
              <div class="next-transit-sub next2-transit-sub" style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#0284c7; border-top:1px dashed #bfdbfe; padding-top:4px; margin-top:4px;">
                <span class="transit-sub-pos">${next2SubLoc}</span>
                ${next2ArrClock ? `<span class="transit-sub-time"><span class="transit-arr-label">도착 예정:</span> <b class="transit-clock-time" style="color:#0284c7; font-weight:900; font-size:16px;">${next2ArrClock}</b>${next2ScheduleBadge}</span>` : ''}
              </div>
            </div>
          `;
        }

        let next3Html = '';
        if (next3 && r.routeNum === '양천01') {
          const next3TimeHtml = `<span class="live-cd" data-time="${next3.targetTime}" style="font-weight:900; color:#7c3aed; font-size:18.5px;">${formatSec(next3.sec)}</span>`;
          next3Html = `
            <div class="next-transit-box next3-transit-box" style="margin-top:5px; padding:7px 10px; background:#faf5ff; border:1.5px solid #d8b4fe; border-radius:8px;">
              <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                <span class="next3-tag-purple" style="color:#6b21a8; font-weight:900; font-size:11px; display:inline-flex; align-items:center;">

                  <span style="margin-left:3px;">다다다음</span>
                  <span class="badge-regular-service" style="display:inline-flex; align-items:center; background:#f5f3ff; color:#6d28d9; font-size:10px; padding:1px 5px; border-radius:4px; font-weight:700; margin-left:6px; border:1px solid #ddd6fe;">정규배차</span>
                </span>
                <span class="next-time-big next3-time-big">
                  ${next3TimeHtml}
                </span>
              </div>
              <div class="next-transit-sub next3-transit-sub" style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#7c3aed; border-top:1px dashed #d8b4fe; padding-top:4px; margin-top:4px;">
                <span class="transit-sub-pos">배차: <b>평일 5~8분 / 주말 8~12분</b></span>
                <span class="transit-sub-time"><span class="transit-arr-label">도착 예정:</span> <b class="transit-clock-time" style="color:#7c3aed; font-weight:900; font-size:16px;">${next3.clockStr}</b></span>
              </div>
            </div>
          `;
        }

        let routeDescHtml = `<span style="font-size:10.5px; color:#64748b; font-weight:600;">${r.typeText}</span>`;
        if (r.typeText && r.typeText.includes(' / ')) {
          const parts = r.typeText.split(' / ');
          routeDescHtml = `<div class="bit-route-desc-col"><span class="bit-route-desc-l1">${parts[0]}</span><span class="bit-route-desc-l2">${parts[1]}</span></div>`;
        }

        return `
          <div class="bit-route-item" style="padding:8px 10px;">
            <div class="bit-route-top" style="margin-bottom:4px;">
              <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1 1 auto; overflow:hidden;">
                <span class="${r.badgeClass}">${r.routeNum}</span>
                ${routeDescHtml}
                ${nextScheduleBadge}
              </div>
              <div class="bus-time-zoom-ctrl">
                <button type="button" class="btn-time-zoom-btn btn-time-zoom-plus" onclick="increaseTimeFontSize(event)" title="도착시간 글씨 확대" aria-label="도착시간 글씨 확대">
                  <span class="zoom-btn-icon">＋</span>
                </button>
                <button type="button" class="btn-time-zoom-btn btn-time-zoom-reset" onclick="resetTimeFontSize(event)" title="도착시간 글씨 원래대로 복귀" aria-label="도착시간 글씨 원래대로 복귀">
                  <span class="zoom-btn-icon">↺</span>
                </button>
              </div>
            </div>
            ${nextHtml}
            ${next2Html}
            ${next3Html}
          </div>
        `;
      }).join('');

      const busHtml = `
        <div class="bit-board-card">
          <div class="bit-header-row">
            <div class="bit-title-group">
              <span class="bit-ars-badge clickable-ars-badge" onclick="openStationBusesModal('${config.arsId}', '${config.stationName}')" role="button" tabindex="0" title="이 정류소 전체 버스 도착정보(카카오맵 스타일) 팝업 조회">ARS ${config.arsId} 🔍</span>
              <strong class="bit-station-name clickable-station-name" onclick="openStationBusesModal('${config.arsId}', '${config.stationName}')" title="이 정류소 전체 버스 도착정보 팝업 조회">${config.stationName}</strong>
              <button type="button" class="btn-open-all-buses" onclick="openStationBusesModal('${config.arsId}', '${config.stationName}')" title="이 정류소 전체 버스 실시간 도착정보 팝업 조회">전체버스 ↗</button>
            </div>
            <div style="display:flex; align-items:center; gap:5px;">
              <span class="bit-status-live"><span class="bit-status-dot"></span> 서울시 실시간</span>
              <button type="button" onclick="openTimetableModal('bus')" style="background:#fef3c7; color:#92400e; border:1px solid #fde68a; font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:5px; cursor:pointer;">🗓️ 시간표</button>
            </div>
          </div>
          <div class="bit-desc-row" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            <span>📍 정류소 실시간 도착 현황</span>
            <span class="bit-dest-pill">${config.destNote}</span>
          </div>
          <div class="bit-route-list">${busRows}</div>
          <div class="bit-footer-info">
            <span>💡 서울시 버스도착정보 공식 API(TOPIS) 연동으로 실시간 버스 번호 및 초 단위 카운트다운을 제공합니다.</span>
          </div>
        </div>
      `;

      // 2. 지하철 도착 정보 (실시간 9호선 일반열차 번호 연동 vs 역사시간표 계산 선택 가능)
      const subStName = isCommute ? '선유도역 9호선 [상행]' : '국회의사당역 9호선 [하행]';
      const subDir = isCommute ? '당산·중앙보훈병원 방면' : '당산·개화 방면 (선유도역 방향)';

      const isHolidayToday = isWeekendOrHoliday(now);
      const dayTypeLabel = isHolidayToday ? '🌴 주말·공휴일 시간표' : '🗓️ 평일 시간표';

      const isTimetableMode = (subwaySourceMode === 'timetable');
      let isLiveSub = false;
      let t1 = null;
      let t2 = null;

      if (!isTimetableMode) {
        // [1] 서울시 실시간 지하철 모드: 공공 API 실시간 일반열차 파싱 시도 (열차번호/실시간 위치)
        const realtimeSub = parseRealtimeSubwayArrival(subwayTargetStation, subwayUpdn, subwayRaw, now, nowMs);
        if (realtimeSub && realtimeSub.nextTrain) {
          isLiveSub = true;
          t1 = realtimeSub.nextTrain;
          t2 = realtimeSub.next2Train;
        }
      }

      // [2] 시간표 모드이거나 실시간 데이터가 없는 경우: 역사 고정 시간표로 도착시간 계산
      if (!t1) {
        const prioritizedTrains = getPrioritizedTrains(now, isCommute, 2);
        if (prioritizedTrains && prioritizedTrains.length > 0) {
          const pt1 = prioritizedTrains[0];
          const pt2 = prioritizedTrains.length > 1 ? prioritizedTrains[1] : null;
          t1 = {
            trainNo: '',
            sec: pt1.sec,
            destName: pt1.endStationName,
            curLocation: '',
            statusMsg: isTimetableMode ? '공식 시간표 정시 운행' : '역고정 공식 시간표 (실시간 대기)',
            clockStr: pt1.departureTime,
            targetTime: pt1.targetTime,
            isLive: false,
            isArrivingSoon: pt1.sec <= 30
          };
          if (pt2) {
            t2 = {
              trainNo: '',
              sec: pt2.sec,
              destName: pt2.endStationName,
              curLocation: '',
              statusMsg: isTimetableMode ? '공식 시간표 정시 운행' : '역고정 공식 시간표 (실시간 대기)',
              clockStr: pt2.departureTime,
              targetTime: pt2.targetTime,
              isLive: false,
              isArrivingSoon: pt2.sec <= 30
            };
          }
        }
      }

      let subScheduleHtml = '';
      if (t1) {
        const arrivalLabel = isTimetableMode ? '시간표 도착:' : '도착 예정:';

        let t2Html = '';
        if (t2) {
          const t2Plate = t2.trainNo
            ? `<span class="badge-bus-plate badge-train-plate" style="display:inline-flex; align-items:center; background:#eff6ff; color:#1e40af; font-size:11px; padding:2px 7px; border-radius:5px; font-weight:800; margin-left:6px; border:1.5px solid #bfdbfe;">${formatPlateWithBigDigits(t2.trainNo, '🚇')}</span>`
            : `<span class="badge-low-bus" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">${isTimetableMode ? '🗓️ 정시시간표' : '역고정(공식)'}</span>`;
          const t2TimeHtml = (t2.isArrivingSoon || t2.sec <= 30)
            ? `<span class="transit-time-arrive transit-time-arrive-big" style="color:#dc2626; font-weight:900; font-size:20px;">⚡ 곧 도착</span>`
            : `<span class="live-cd" data-time="${t2.targetTime}" style="font-weight:900; font-size:18.5px; color:#1e40af;">${formatSec(t2.sec)}</span>`;

          let t2SubLoc = '';
          if (isTimetableMode) {
            t2SubLoc = isCommute ? '선유도역 탑승' : '국회의사당역 탑승';
          } else {
            t2SubLoc = t2.curLocation ? `${t2.curLocation} ${t2.statusMsg || ''}`.trim() : (isCommute ? '선유도역 탑승' : '국회의사당역 탑승');
          }
          t2SubLoc = t2SubLoc.replace(/9호선\s*공식\s*시간표\s*기준/g, '')
                             .replace(/공식\s*시간표\s*정시\s*운행/g, '')
                             .replace(/공식\s*시간표/g, '')
                             .replace(/시간표\s*기준/g, '')
                             .replace(/역고정\s*\(공식\)/g, '')
                             .trim();
          if (!t2SubLoc) t2SubLoc = isCommute ? '선유도역 탑승' : '국회의사당역 탑승';

          t2Html = `
            <div class="next-transit-box next2-transit-box" style="margin-top:5px; padding:7px 10px; background:#f8fafc; border:1.5px solid #bfdbfe; border-radius:8px;">
              <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                <span class="next2-tag-blue" style="color:#1d4ed8; font-weight:900; font-size:11px; display:inline-flex; align-items:center;">
                  <span>🔵</span>
                  <span style="margin-left:3px;">다다음 열차</span>
                  ${t2Plate}
                </span>
                <span class="next-time-big next2-time-big">
                  ${t2TimeHtml}
                </span>
              </div>
              <div class="next-transit-sub next2-transit-sub" style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#0284c7; border-top:1px dashed #bfdbfe; padding-top:4px; margin-top:4px;">
                <span>위치: <b>${t2SubLoc}</b></span>
                <span class="transit-sub-time"><span class="transit-arr-label" style="font-size:13px; font-weight:800;">${arrivalLabel}</span> <b class="transit-clock-time subway-clock-time-next2" style="font-size:18.5px; font-weight:900; margin-left:4px;">${t2.clockStr}</b></span>
              </div>
            </div>
          `;
        }

        const trainBadge = t1.trainNo
          ? `<span class="badge-bus-plate badge-train-plate" style="display:inline-flex; align-items:center; background:#dbeafe; color:#1e3a8a; font-size:11px; padding:2px 7px; border-radius:5px; font-weight:800; margin-left:6px; border:1.5px solid #93c5fd;">${formatPlateWithBigDigits(t1.trainNo, '🚇')}</span>`
          : `<span class="badge-low-bus" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">${isTimetableMode ? '🗓️ 정시시간표' : '역고정(공식)'}</span>`;

        // 위치 문구 간결화 (뒤의 도착 시각이 잘 보이도록 불필요한 '9호선 공식 시간표 기준' 완전 제거)

        subScheduleHtml = `

      const subHtml = `

      if (isCommute) {

      renderEstimationBox(isCommute, busDataMap, t1, t2, isTimetableMode);

    /**
     * 3대 버스(양천01, 603, 6620) 중 특정 도착시각 이후 가장 빨리 탈 수 있는 최적 버스 선정
     */
    function findFastestBus(routes, busDataMap, reachTimeMs, now, nowMs) {
      const routeBestList = [];

      routes.forEach(r => {
        const item = busDataMap ? busDataMap[r.routeNum] : null;
        const { next, next2, next3 } = parseSeoulBus(r, item, now, nowMs);
        const headway = getRouteHeadwaySec(r.routeNum, now);

        // 노선의 실시간/시간표 버스 목록 수집
        const busList = [];
        if (next && next.targetTime && !next.isWait && !next.isEnd) {
          busList.push({ targetTime: next.targetTime, label: '다음', plainNo: next.plainNo || '' });
        }
        if (next2 && next2.targetTime && !next2.isWait && !next2.isEnd) {
          busList.push({ targetTime: next2.targetTime, label: '다다음', plainNo: next2.plainNo || '' });
        }
        if (next3 && next3.targetTime) {
          busList.push({ targetTime: next3.targetTime, label: '다다다음', plainNo: '' });
        }

        // 1. reachTimeMs 이후에 오는 버스가 이미 목록에 있다면 그 중 가장 이른 버스 찾기
        let candidate = busList.find(b => b.targetTime >= reachTimeMs);

        // 만약 candidate가 있더라도 대기시간이 해당 노선 배차간격보다 길다면,
        // 지하철 시각 차이가 버스 고정시각에 삼켜지지 않도록 정규 순환 배차 반영
        if (candidate && (candidate.targetTime - reachTimeMs) > headway * 1000) {
          const cycleTime = reachTimeMs + Math.max(60000, Math.round((headway * 1000) * 0.45));
          candidate = {
            targetTime: cycleTime,
            label: `${r.routeNum} 순환배차`,
            plainNo: candidate.plainNo || ''
          };
        } else if (!candidate) {
          let baseTimeMs = (busList.length > 0)
            ? busList[busList.length - 1].targetTime
            : nowMs;
          
          let count = 0;
          while (baseTimeMs < reachTimeMs && count < 20) {
            baseTimeMs += headway * 1000;
            count++;
          }

          candidate = {
            targetTime: baseTimeMs,
            label: count > 1 ? `차기 ${count}회차` : '차기 배차',
            plainNo: ''
          };
        }

        routeBestList.push({
          routeNum: r.routeNum,
          badgeClass: r.badgeClass,
          label: candidate.label,
          targetTime: candidate.targetTime,
          plainNo: candidate.plainNo || '',
          waitMin: Math.max(0, Math.round((candidate.targetTime - reachTimeMs) / 60000))
        });
      });

      // 3개 노선(양천01, 603, 6620) 중 탑승 시각(targetTime)이 가장 빠른 버스 선택!
      // 탑승 시각이 동일한 경우 배차간격이 가장 짧은 양천01 우선
      routeBestList.sort((a, b) => {
        if (a.targetTime !== b.targetTime) return a.targetTime - b.targetTime;
        if (a.routeNum === '양천01') return -1;
        if (b.routeNum === '양천01') return 1;
        return 0;
      });

      return routeBestList[0];
    }

    /**
     * 특정 도보 도착시각 이후 가장 빨리 탈 수 있는 지하철(실시간 or 역사시간표) 선정
     */
    function findFastestSubway(reachTimeMs, isCommute, isTimetableMode, t1, t2) {
      const reachDate = new Date(reachTimeMs);
      const trains = (typeof getPrioritizedTrains === 'function')
        ? getPrioritizedTrains(reachDate, isCommute, 8)
        : [];

      const ttTrain = (trains && trains.length > 0)
        ? trains.find(tr => tr.targetTime >= reachTimeMs) || trains[0]
        : null;

      // [1] 시간표 모드인 경우: 공식 역사 고정 시간표 정시 열차를 정확히 선택
      if (isTimetableMode) {
        if (ttTrain) {
          return {
            clockStr: ttTrain.departureTime,
            trainNo: '',
            targetTime: ttTrain.targetTime,
            isLive: false,
            modeTag: '정시 시간표'
          };
        }
      }

      // [2] 실시간 모드인 경우:
      // (A) 실시간 열차(t1, t2) 중 reachTimeMs 이후 탑승 가능한 열차가 있다면 즉시 선택
      const liveList = [];
      if (t1 && t1.targetTime && t1.targetTime >= reachTimeMs) liveList.push(t1);
      if (t2 && t2.targetTime && t2.targetTime >= reachTimeMs) liveList.push(t2);

      if (liveList.length > 0) {
        liveList.sort((a, b) => a.targetTime - b.targetTime);
        const sel = liveList[0];
        return {
          clockStr: sel.clockStr,
          trainNo: sel.trainNo || '',
          targetTime: sel.targetTime,
          isLive: true,
          modeTag: '실시간'
        };
      }

      // (B) 실시간 t1, t2가 이미 reachTimeMs 이전에 통과한 경우:
      // 실시간 열차가 시간표 대비 몇 분 지연(or 조기 도착) 운행 중인지 편차를 도출하여 역사 시간표에 연동!
      let liveDelayMs = 0;
      if (t1 && t1.targetTime) {
        const nowMs = Date.now();
        const t1RemainSec = Math.max(0, Math.round((t1.targetTime - nowMs) / 1000));
        const schedFirst = (typeof getPrioritizedTrains === 'function') ? getPrioritizedTrains(new Date(nowMs), isCommute, 1)?.[0] : null;
        if (schedFirst && schedFirst.targetTime) {
          const schedSec = Math.max(0, Math.round((schedFirst.targetTime - nowMs) / 1000));
          const diffSec = t1RemainSec - schedSec;
          // 실시간 지연 오차 (-2분 ~ +4분 클램프)
          liveDelayMs = Math.max(-120000, Math.min(240000, diffSec * 1000));
        }
      }

      if (ttTrain) {
        let adjTargetTime = ttTrain.targetTime + liveDelayMs;
        if (adjTargetTime < reachTimeMs) {
          const nextTt = trains.find(tr => tr.targetTime > ttTrain.targetTime);
          if (nextTt) adjTargetTime = nextTt.targetTime + liveDelayMs;
        }
        const adjDate = new Date(adjTargetTime);
        const adjClock = `${String(adjDate.getHours()).padStart(2, '0')}:${String(adjDate.getMinutes()).padStart(2, '0')}`;
        return {
          clockStr: adjClock,
          trainNo: (t1 && t1.trainNo) ? t1.trainNo : '',
          targetTime: adjTargetTime,
          isLive: true,
          modeTag: '실시간'
        };
      }

      // Fallback
      const fbMs = reachTimeMs + 4 * 60000;
      const d = new Date(fbMs);
      return {
        clockStr: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`,
        trainNo: '',
        targetTime: fbMs,
        isLive: false,
        modeTag: '예상'
      };
    }

    function renderEstimationBox(isCommute, busDataMap = null, t1 = null, t2 = null, isTimetableMode = false) {
      const box = document.getElementById('commuteEstimationSummaryBox');
      if (!box) return;

      const now = new Date();
      const nowMs = now.getTime();
      const config = BUS_CONFIGS[isCommute ? 'commute' : 'offwork'];

      const WALK_OFFICE_SUB = 9;        // 회사 ↔ 국회의사당역 승강장 (도보 9분)
      const WALK_SUB_BUS_TRANSIT = 3;   // 선유도역 승강장 ↔ 선유도역1번출구 버스정류장 (도보 3분)
      const WALK_HOME_BUS = 9;          // 목동6단지 버스정류장 ↔ 집 (도보 9분)
      // 도보 합계: 9 + 3 + 9 = 21분

      const RIDE_SUBWAY = 4;            // 9호선 일반열차 두 정거장(선유도 ↔ 당산 ↔ 국회의사당) 공식 운행 소요시간: 정확히 4분
      const RIDE_BUS = 3;               // 버스(선유도역1번출구 ↔ 목동6단지앞) 승차 이동: 3분
      // 승차 합계: 4 + 3 = 7분

      const fmtTime = (d) => {
        if (!d) return '--:--';
        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
      };

      const fmtClockFull = (d) => {
        if (!d) return '--:--';
        const h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? '오후' : '오전';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        const mStr = String(m).padStart(2, '0');
        return `${ampm} ${h12}시 ${mStr}분`;
      };

      let est = null;

      if (isCommute) {
        // [출근] 집 ➔ 도보 9분 ➔ 6단지 버스정류장 ➔ 버스 3분 ➔ 선유도역 ➔ 도보 3분 환승 ➔ 지하철 4분 ➔ 국회의사당역 ➔ 도보 9분 ➔ 회사
        const t0 = now;
        // 1단계: 집에서 6단지 버스정류장까지 도보 9분
        const t_reach_bus = new Date(nowMs + WALK_HOME_BUS * 60000);
        
        // 2단계: 정류장 도착(t_reach_bus) 이후 탈 수 있는 가장 빠른 버스 (양천01, 603, 6620)
        const chosenBus = findFastestBus(config.routes, busDataMap, t_reach_bus.getTime(), now, nowMs);
        const t_bus_board = new Date(chosenBus.targetTime);
        const busWaitMin = Math.max(0, Math.round((t_bus_board.getTime() - t_reach_bus.getTime()) / 60000));

        // 3단계: 버스 3분 승차 후 선유도역 버스정류장 하차
        const t_drop_bus = new Date(t_bus_board.getTime() + RIDE_BUS * 60000);
        // 4단계: 선유도역 1번출구 버스정류장 ➔ 선유도역 9호선 승강장 환승 도보 3분
        const t_reach_sub = new Date(t_drop_bus.getTime() + WALK_SUB_BUS_TRANSIT * 60000);

        // 5단계: 선유도역 승강장 도착(t_reach_sub) 이후 탑승 가능한 9호선 일반열차 (시간표 vs 실시간)
        const chosenTrain = findFastestSubway(t_reach_sub.getTime(), true, isTimetableMode, t1, t2);
        const t_sub_board = new Date(chosenTrain.targetTime);
        const subWaitMin = Math.max(0, Math.round((t_sub_board.getTime() - t_reach_sub.getTime()) / 60000));

        // 6단계: 9호선 일반열차 두 정거장(선유도 ➔ 당산 ➔ 국회의사당) 4분 이동 후 하차
        const t_drop_sub = new Date(t_sub_board.getTime() + RIDE_SUBWAY * 60000);
        // 7단계: 국회의사당역에서 회사까지 도보 9분 이동
        // 총 소요시간: 도보 21분 + 승차 7분 + 버스 대기 + 지하철 대기 (절대적 산술 덧셈)
        const totalMinutes = 21 + 7 + busWaitMin + subWaitMin;
        const t_final = new Date(nowMs + totalMinutes * 60000);

        est = {
          mode: 'commute',
          startTime: t0,
          t_reach_bus,
          chosenBus,
          t_bus_board,
          busWaitMin,
          t_drop_bus,
          t_reach_sub,
          chosenTrain,
          t_sub_board,
          subWaitMin,
          t_drop_sub,
          t_final,
          totalMinutes
        };
      } else {
        // [퇴근] 회사 ➔ 도보 9분 ➔ 국회의사당역 ➔ 지하철 4분 ➔ 선유도역 ➔ 도보 3분 환승 ➔ 버스 3분 ➔ 6단지 ➔ 도보 9분 ➔ 집
        const t0 = now;
        // 1단계: 회사에서 국회의사당역 승강장까지 도보 9분
        const t_reach_sub = new Date(nowMs + WALK_OFFICE_SUB * 60000);

        // 2단계: 국회의사당역 승강장 도착(t_reach_sub) 이후 탑승 가능한 9호선 일반열차 (시간표 vs 실시간)
        const chosenTrain = findFastestSubway(t_reach_sub.getTime(), false, isTimetableMode, t1, t2);
        const t_sub_board = new Date(chosenTrain.targetTime);
        const subWaitMin = Math.max(0, Math.round((t_sub_board.getTime() - t_reach_sub.getTime()) / 60000));

        // 3단계: 9호선 일반열차 두 정거장(국회의사당 ➔ 당산 ➔ 선유도) 4분 이동 후 하차
        const t_drop_sub = new Date(t_sub_board.getTime() + RIDE_SUBWAY * 60000);
        // 4단계: 선유도역 승강장 ➔ 1번출구 버스정류장 환승 도보 3분
        const t_reach_bus = new Date(t_drop_sub.getTime() + WALK_SUB_BUS_TRANSIT * 60000);

        // 5단계: 선유도역 버스정류장 도착(t_reach_bus) 이후 오는 가장 빠른 버스 (양천01, 603, 6620)
        const chosenBus = findFastestBus(config.routes, busDataMap, t_reach_bus.getTime(), now, nowMs);
        const t_bus_board = new Date(chosenBus.targetTime);
        const busWaitMin = Math.max(0, Math.round((t_bus_board.getTime() - t_reach_bus.getTime()) / 60000));

        // 6단계: 버스 3분 승차 후 목동6단지앞 하차
        const t_drop_bus = new Date(t_bus_board.getTime() + RIDE_BUS * 60000);
        // 7단계: 목동6단지에서 집까지 도보 9분 이동
        // 총 소요시간: 도보 21분 + 승차 7분 + 지하철 대기 + 버스 대기 (절대적 산술 덧셈)
        const totalMinutes = 21 + 7 + busWaitMin + subWaitMin;
        const t_final = new Date(nowMs + totalMinutes * 60000);

        est = {
          mode: 'offwork',
          startTime: t0,
          t_reach_sub,
          chosenTrain,
          t_sub_board,
          subWaitMin,
          t_drop_sub,
          t_reach_bus,
          chosenBus,
          t_bus_board,
          busWaitMin,
          t_drop_bus,
          t_final,
          totalMinutes
        };
      }

      const totalMins = est.totalMinutes;
      const arrDate = est.t_final;

    async function fetchStationBuses(arsId) {
      const cleanArsId = String(arsId).replace(/[^0-9]/g, '');
      const directUrl = `http://ws.bus.go.kr/api/rest/stationinfo/getStationByUid?serviceKey=${stationBusApiKey}&arsId=${cleanArsId}&resultType=json`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          const items = data?.msgBody?.itemList;
          if (Array.isArray(items) && items.length > 0) {
            stationBusesCache[cleanArsId] = items;
            return items;
          }
        }
      } catch (e) {}

      const proxyList = [
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxyList) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const items = data?.msgBody?.itemList;
            if (Array.isArray(items) && items.length > 0) {
              stationBusesCache[cleanArsId] = items;
              return items;
            }
          }
        } catch (err) {}
      }

      return stationBusesCache[cleanArsId] || [];
    }

    function openStationBusesModal(arsId = '15-154', stationName = '') {
      currentStationModalArsId = arsId || '15-154';
      currentStationModalName = stationName || (String(arsId).includes('154') ? '이대목동병원·목동6단지앞' : '선유도역1번출구·한신아파트');
      stationModalFilter = 'all';
      stationModalCountdown = 15;

      ensureStationBusesModal();
      const modal = document.getElementById('stationBusesModal');
      if (modal) {
        modal.style.display = 'flex';
        modal.classList.add('active');
      }

      loadStationBusesData(true);
      startStationBusesTicker();
    }

    function closeStationBusesModal() {
      const modal = document.getElementById('stationBusesModal');
      if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('active');
      }
      stopStationBusesTicker();
    }

    function switchStationModalFilter(filterKey) {
      stationModalFilter = filterKey;
      renderStationBusesModal();
    }

    function toggleStationModalSort(sortKey) {
      if (sortKey) {
        stationModalSort = sortKey;
      } else {
        stationModalSort = (stationModalSort === 'arrival') ? 'route' : 'arrival';
      }
      renderStationBusesModal();
    }

    function triggerStationModalRefresh() {
      stationModalCountdown = 15;
      const btn = document.getElementById('btnRefreshStationBuses');
      if (btn) btn.classList.add('spinning');
      loadStationBusesData(true).finally(() => {
        if (btn) btn.classList.remove('spinning');
      });
    }

      if (document.getElementById('stationBusesModal')) return;

      const modalHtml = `
        <div class="modal-overlay" id="stationBusesModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.7); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); z-index:100000; justify-content:center; align-items:center; padding:12px;">
          <div class="modal-container station-buses-container" style="background:#f8fafc; width:100%; max-width:480px; max-height:90vh; border-radius:20px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.35); display:flex; flex-direction:column; overflow:hidden; border:1px solid #cbd5e1;">
            
            <div class="modal-header station-modal-header" style="background:linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color:#ffffff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">
                <span style="font-size:18px; flex-shrink:0;">🚏</span>
                <div style="min-width:0; overflow:hidden;">
                  <div style="display:flex; align-items:center; gap:6px;">
                    <strong id="stModalStationName" style="font-size:15px; font-weight:900; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">정류소 전체 버스 도착</strong>
                    <span id="stModalArsBadge" style="background:#0284c7; color:#ffffff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; flex-shrink:0;">ARS 15-154</span>
                  </div>
                  <div style="font-size:11px; color:#94a3b8; margin-top:2px; display:flex; align-items:center; gap:4px;">
                    <span>카카오맵 실시간 도착정보 직결</span>
                    <span>·</span>
                    <span id="stModalRefreshTimerText" style="color:#38bdf8; font-weight:700;">15초 자동갱신</span>
                  </div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">

                <button type="button" class="modal-close-btn" onclick="closeStationBusesModal()" style="background:rgba(255,255,255,0.15); border:none; color:#ffffff; font-size:16px; width:30px; height:30px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
              </div>
            </div>

            <div style="background:#ffffff; border-bottom:1px solid #e2e8f0; padding:8px 12px; display:flex; flex-direction:column; gap:6px;">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <div id="stModalFilterChips" style="display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;"></div>
                <div id="stModalSortWrap" style="flex-shrink:0;"></div>
              </div>
