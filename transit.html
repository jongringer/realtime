  <script>
    const SEOUL_BUS_KEY = 'df332cd23ac6df535a295747d46e0328dd0fd3faed11cec584c87a0ca1e7a759';
    let currentMode = 'commute';
    let autoReason = '';
    const REFRESH_INTERVAL = 25;
    let refreshCountdown = 25;
    let isFetching = false;
    let subwaySourceMode = localStorage.getItem('subway_source_mode') || 'realtime'; // 'realtime' | 'timetable'
    let lastBusResults = null;
    let lastSubwayRaw = null;

    function setSubwaySourceMode(mode) {
      subwaySourceMode = mode;
      try {
        localStorage.setItem('subway_source_mode', mode);
      } catch (e) {}

      // 누르는 즉각 0.001초 만에 버튼 색상 전환 및 반짝임 애니메이션 발동 (재터치 시에도 즉각 반응)
      const btnReal = document.getElementById('btnSubwayRealtime');
      const btnTime = document.getElementById('btnSubwayTimetable');
      if (btnReal && btnTime) {
        btnReal.classList.remove('sparkle-active-green', 'sparkle-active-amber');
        btnTime.classList.remove('sparkle-active-green', 'sparkle-active-amber');
        void btnReal.offsetWidth;
        void btnTime.offsetWidth;

        if (mode === 'realtime') {
          btnReal.className = 'subway-mode-btn active-realtime sparkle-active-green';
          btnTime.className = 'subway-mode-btn';
        } else {
          btnTime.className = 'subway-mode-btn active-timetable sparkle-active-amber';
          btnReal.className = 'subway-mode-btn';
        }
      }

      // 전체 화면 로딩 스피너 및 네트워크 대기 없이 즉시 0ms 만에 지하철 도착시각 재계산 및 렌더링
      renderCards(false, false);
    }
    window.setSubwaySourceMode = setSubwaySourceMode;

    function getRouteHeadwaySec(routeNum, now) {
      const isHoliday = (typeof isWeekendOrHoliday === 'function') ? isWeekendOrHoliday(now) : false;
      if (routeNum === '양천01') {
        if (isHoliday) return 600; // 주말·공휴일 10분 (약 8~12분)
        const h = now.getHours();
        const m = now.getMinutes();
        const hm = h * 60 + m;
        const isRush = (hm >= 7 * 60 && hm <= 9 * 60 + 30) || (hm >= 17 * 60 + 30 && hm <= 20 * 60);
        return isRush ? 360 : 450; // 평일 출퇴근 혼잡 6분(5~8분), 평시 7.5분
      }
      if (routeNum === '603') return isHoliday ? 780 : 660; // 13분 / 11분
      if (routeNum === '6620') return isHoliday ? 960 : 780; // 16분 / 13분
      return 600;
    }

    const BUS_CONFIGS = {
      commute: {
        arsId: '15-154',
        stId: '114000052',
        stationName: '이대목동병원·목동6단지앞',
        destNote: '선유도역·당산역 방면',
        routes: [
          { routeNum: '양천01', busRouteId: '114900001', stId: '114000052', ord: '17', badgeClass: 'badge-seoul-town', typeText: '마을버스 (평일 5~8분 / 주말·공휴일 8~12분)', headway: 360 },
          { routeNum: '603',   busRouteId: '100100088', stId: '114000052', ord: '22', badgeClass: 'badge-seoul-blue', typeText: '간선버스 (배차 10~12분)', headway: 660 },
          { routeNum: '6620',  busRouteId: '100100300', stId: '114000052', ord: '28', badgeClass: 'badge-seoul-green', typeText: '지선버스 (당산역 방면)', headway: 720 }
        ]
      },
      offwork: {
        arsId: '19-210',
        stId: '118000125',
        stationName: '선유도역1번출구·한신아파트',
        destNote: '목동아파트 단지 방면 환승',
        routes: [
          { routeNum: '양천01', busRouteId: '114900001', stId: '118000125', ord: '20', badgeClass: 'badge-seoul-town', typeText: '마을버스 (평일 5~8분 / 주말·공휴일 8~12분)', headway: 360 },
          { routeNum: '603',   busRouteId: '100100088', stId: '118000125', ord: '62', badgeClass: 'badge-seoul-blue', typeText: '간선버스 (배차 10~12분)', headway: 660 },
          { routeNum: '6620',  busRouteId: '100100300', stId: '118000125', ord: '34', badgeClass: 'badge-seoul-green', typeText: '지선버스 (차고지 방면)', headway: 720 }
        ]
      }
    };

    const busCache = {};
    const SEOUL_SUBWAY_KEY = '476a79484b6a6f6e3833504f4f6d4e';
    const subwayCache = {};

    function formatSec(sec) {
      if (sec <= 0) return '<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>';
      if (sec < 60) return `<span style="color:#dc2626; font-weight:900;">${sec}초 후</span>`;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const sStr = s < 10 ? '0' + s : s;
      return `<span class="transit-time-min">${m}분</span> <span class="transit-time-sec">${sStr}초 후</span>`;
    }

    function formatPlateWithBigDigits(plate, icon = '🚌') {
      if (!plate) return '';
      const str = String(plate).trim();
      const m = str.match(/^(.*?)(\d{4})$/);
      if (m) {
        const prefix = m[1] ? `${m[1]} ` : '';
        return `${icon} ${prefix}<strong class="plate-digit-highlight" style="font-size:14.5px; font-weight:900; letter-spacing:0.5px; margin-left:1px;">${m[2]}</strong>`;
      }
      return `${icon} ${str}`;
    }

    function formatPlateSmall(plate) {
      if (!plate) return '';
      const str = String(plate).trim();
      const m = str.match(/^(.*?)(\d{4})$/);
      if (m) {
        const prefix = m[1] ? `${m[1]} ` : '';
        return `${prefix}<strong style="font-size:12px; font-weight:800;">${m[2]}</strong>`;
      }
      return str;
    }

    async function fetchSeoulBusArrival(busRouteId, stId, ord) {
      const cacheKey = `${busRouteId}_${stId}_${ord}`;
      const directUrl = `http://ws.bus.go.kr/api/rest/arrive/getArrInfoByRoute?serviceKey=${SEOUL_BUS_KEY}&busRouteId=${busRouteId}&stId=${stId}&ord=${ord}&resultType=json`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          const item = data?.msgBody?.itemList?.[0];
          if (item) {
            busCache[cacheKey] = item;
            return item;
          }
        }
      } catch (e) {}

      const proxies = [
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const item = data?.msgBody?.itemList?.[0];
            if (item) {
              busCache[cacheKey] = item;
              return item;
            }
          }
        } catch (err) {}
      }

      return busCache[cacheKey] || null;
    }

    async function fetchSeoulSubwayArrival(stationName) {
      const cacheKey = stationName;
      const directUrl = `http://swopenAPI.seoul.go.kr/api/subway/${SEOUL_SUBWAY_KEY}/json/realtimeStationArrival/0/10/${encodeURIComponent(stationName)}`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          if (data && data.realtimeArrivalList) {
            subwayCache[cacheKey] = data.realtimeArrivalList;
            return data.realtimeArrivalList;
          }
        }
      } catch (e) {}

      const proxies = [
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            if (data && data.realtimeArrivalList) {
              subwayCache[cacheKey] = data.realtimeArrivalList;
              return data.realtimeArrivalList;
            }
          }
        } catch (err) {}
      }

      return subwayCache[cacheKey] || null;
    }

    function parseSeoulBus(routeConfig, busItem, now, nowMs) {
      const dynamicHeadway = getRouteHeadwaySec(routeConfig.routeNum, now);
      const headway = dynamicHeadway || routeConfig.headway || 420;
      const targetOrd = parseInt(routeConfig.ord, 10);
      let next = null;
      let next2 = null;
      let next3 = null;

      if (busItem) {
        const traTime1 = parseInt(busItem.traTime1 || '0', 10);
        const sectOrd1 = parseInt(busItem.sectOrd1 || '0', 10);
        const arrmsg1 = (busItem.arrmsg1 || '').trim();
        const plainNo1 = (busItem.plainNo1 || '').trim();

        const traTime2 = parseInt(busItem.traTime2 || '0', 10);
        const sectOrd2 = parseInt(busItem.sectOrd2 || '0', 10);
        const arrmsg2 = (busItem.arrmsg2 || '').trim();
        const plainNo2 = (busItem.plainNo2 || '').trim();

        let stop1Text = '';
        const m1 = arrmsg1.match(/\[(\d+)번째\s*전\]/);
        if (m1) stop1Text = `[${m1[1]}번째 전]`;
        else if (sectOrd1 > 0 && targetOrd > sectOrd1) stop1Text = `[${targetOrd - sectOrd1}번째 전]`;

        const isArrivingSoon1 = arrmsg1.includes('곧 도착');
        const isWait1 = arrmsg1.includes('출발대기');
        const isEnd1 = arrmsg1.includes('운행종료');

        let sec1 = traTime1;
        if (isArrivingSoon1) sec1 = Math.min(sec1 > 0 ? sec1 : 30, 45);

        next = {
          sec: sec1,
          arrmsg: arrmsg1,
          stopText: stop1Text,
          plainNo: plainNo1,
          isArrivingSoon: isArrivingSoon1,
          isWait: isWait1,
          isEnd: isEnd1,
          targetTime: (sec1 > 0) ? (nowMs + sec1 * 1000) : null
        };

        let stop2Text = '';
        const m2 = arrmsg2.match(/\[(\d+)번째\s*전\]/);
        if (m2) stop2Text = `[${m2[1]}번째 전]`;
        else if (sectOrd2 > 0 && targetOrd > sectOrd2) stop2Text = `[${targetOrd - sectOrd2}번째 전]`;

        const isWait2 = arrmsg2.includes('출발대기');
        const isEnd2 = arrmsg2.includes('운행종료');
        const isArrivingSoon2 = arrmsg2.includes('곧 도착');

        if (traTime2 > 0 || isWait2 || isArrivingSoon2) {
          let sec2 = traTime2;
          if (isArrivingSoon2) sec2 = Math.min(sec2 > 0 ? sec2 : 45, 60);

          next2 = {
            sec: sec2,
            arrmsg: arrmsg2,
            stopText: stop2Text,
            plainNo: plainNo2,
            isWait: isWait2,
            isEnd: isEnd2,
            targetTime: (sec2 > 0) ? (nowMs + sec2 * 1000) : null
          };
        } else if (sec1 > 0 && !isWait1 && !isEnd1) {
          const next2Sec = sec1 + headway;
          next2 = {
            sec: next2Sec,
            arrmsg: '배차 간격 운행',
            stopText: '차기 순번',
            plainNo: '',
            isWait: false,
            isEnd: false,
            targetTime: nowMs + next2Sec * 1000
          };
        }
      }

      if (!next) {
        const curSecInHour = now.getMinutes() * 60 + now.getSeconds();
        const cycleOffset = headway - (curSecInHour % headway);
        next = {
          sec: cycleOffset,
          arrmsg: '정규 배차순번',
          stopText: '정규 배차',
          plainNo: '',
          isArrivingSoon: false,
          isWait: false,
          isEnd: false,
          targetTime: nowMs + cycleOffset * 1000
        };
        const next2Sec = cycleOffset + headway;
        next2 = {
          sec: next2Sec,
          arrmsg: '차기 배차순번',
          stopText: '차기 순번',
          plainNo: '',
          isWait: false,
          isEnd: false,
          targetTime: nowMs + next2Sec * 1000
        };
      }

      // 양천01의 경우 사용자 요청에 따라 다다다음(next3)까지 계산 투영 (평일 5~8분 / 주말 8~12분 배차)
      if (routeConfig.routeNum === '양천01') {
        const baseTargetMs = (next2 && next2.targetTime) ? next2.targetTime : (next.targetTime ? next.targetTime + headway * 1000 : nowMs + headway * 2000);
        const next3TargetMs = baseTargetMs + headway * 1000;
        const next3Sec = Math.max(1, Math.round((next3TargetMs - nowMs) / 1000));
        const d3 = new Date(next3TargetMs);
        const clock3 = `${String(d3.getHours()).padStart(2, '0')}:${String(d3.getMinutes()).padStart(2, '0')}`;
        next3 = {
          sec: next3Sec,
          targetTime: next3TargetMs,
          clockStr: clock3,
          arrmsg: '다다다음 순번',
          stopText: '차기 배차'
        };
      }

      // 사용자 요청: 출퇴근 시간에 버스 시간표에 연동되던 것을 중지하고 버스 번호로 실시간 도착정보를 최우선 수신
      // 실시간 데이터가 없는 경우(심야 등)에만 시간표 보조 활용
      if (next && next.isEstimate) {
        const prioritySchedule = (typeof getPriorityBusSchedule === 'function')
          ? getPriorityBusSchedule(routeConfig.routeNum, (routeConfig.stId === '114000052' || routeConfig.arsId === '15-154') ? '15154' : '', now)
          : null;

        if (prioritySchedule && prioritySchedule.next) {
          const pNext = prioritySchedule.next;
          const pNext2 = prioritySchedule.next2;

          const isImminent = pNext.diffSec <= 35;
          const livePlate1 = (busItem && busItem.plainNo1) ? busItem.plainNo1 : '';

          next = {
            sec: pNext.diffSec,
            rawSec: pNext.diffSec,
            arrmsg: `${pNext.time} 정시운행`,
            stopText: isImminent ? '정류소 진입 중' : `정시 시간표 (${prioritySchedule.periodName})`,
            plainNo: livePlate1,
            isArrivingSoon: isImminent,
            isWait: false,
            isEnd: false,
            targetTime: pNext.targetTime,
            isPriority: true,
            priorityTime: pNext.time,
            periodName: prioritySchedule.periodName
          };

          if (pNext2) {
            const livePlate2 = (busItem && busItem.plainNo2) ? busItem.plainNo2 : '';
            next2 = {
              sec: pNext2.diffSec,

    /**
     * 실시간 서울시 지하철(9호선 일반열차) 데이터 파싱 및 UI 변환
     */
    function parseRealtimeSubwayArrival(stationName, updnLine, rawList, now, nowMs) {
      if (!rawList || !Array.isArray(rawList)) return null;

      // 9호선(subwayId 1009) & 일반열차 & 해당 방향(상행/하행)
      const filtered = rawList.filter(item => {
        if (item.subwayId !== '1009') return false;
        const isNormal = (item.btrainSttus === '일반' || !item.btrainSttus || item.btrainSttus === '0');
        const isDir = (item.updnLine === updnLine);
        return isNormal && isDir;
      });

      if (filtered.length === 0) return null;

      // barvlDt (도착 예정 초) 오름차순 정렬 (보정 후 초 기준)
      filtered.sort((a, b) => {
        const secA = Math.max(0, parseInt(a.barvlDt || '0', 10) - 60);
        const secB = Math.max(0, parseInt(b.barvlDt || '0', 10) - 60);
        return secA - secB;
      });

      const formatTrain = (item) => {
        // 1. 남은 시간 1분(60초) 앞당김 보정 로직 (서버 API 갱신 지연 보정)
        const rawSeconds = parseInt(item.barvlDt || '0', 10);
        // 60초를 차감하여 보정 (음수 방지를 위해 최소값 0 설정)
        const compensatedSeconds = Math.max(0, rawSeconds - 60);

        const trainNo = (item.btrainNo || '').trim();
        const dest = item.bstatnNm || (updnLine === '상행' ? '중앙보훈병원' : '개화');
        const curLoc = item.arvlMsg3 ? `[${item.arvlMsg3}]` : '';
        const statusMsg = (item.arvlMsg2 || '').trim();

        // 2. 60초 이하로 남았거나 상태코드가 진입(0)/도착(1)이거나 메시지에 진입/도착 포함 시 즉시 '곧 도착' 처리
        const isArrivingSoon = (compensatedSeconds === 0) ||
          (item.arvlCd === '0' || item.arvlCd === '1') ||
          statusMsg.includes('도착') || statusMsg.includes('진입');

        let displayEta = "";
        if (isArrivingSoon) {
          displayEta = "⚡ 곧 도착";
        } else {
          const min = Math.floor(compensatedSeconds / 60);
          const secRem = compensatedSeconds % 60;
          displayEta = min === 0 ? `${secRem}초 후` : `${min}분 ${secRem}초 후`;
        }

        let sec = compensatedSeconds;
        if (isArrivingSoon && sec <= 0) sec = 25;
        else if (sec <= 0) sec = 45;

        const targetTime = nowMs + sec * 1000;
        const dt = new Date(targetTime);
        const clockStr = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;

        return {
          sec: sec,
          rawSec: rawSeconds,
          compensatedSec: compensatedSeconds,
          displayEta: displayEta,
          trainNo: trainNo,
          destName: dest,
          curLocation: curLoc,
          statusMsg: statusMsg,
          isArrivingSoon: isArrivingSoon,
          targetTime: targetTime,
          clockStr: clockStr,
          isLive: true
        };
      };

      const nextTrain = filtered[0] ? formatTrain(filtered[0]) : null;
      const next2Train = filtered[1] ? formatTrain(filtered[1]) : null;

      return { nextTrain, next2Train };
    }

    /**
     * 시간표 딕셔너리의 모든 분(minute)을 minutesToShift(1분)만큼 일괄 앞당기는 헬퍼
     */
    function shiftScheduleDictEarlier(scheduleDict, minutesToShift = 1) {
      const adjusted = {};
      for (const [hStr, mins] of Object.entries(scheduleDict)) {
        const h = Number(hStr);
        for (const m of mins) {
          let totalMin = h * 60 + m - minutesToShift;
          if (totalMin < 0) totalMin += 24 * 60;
          const newH = Math.floor(totalMin / 60) % 24;
          const newM = totalMin % 60;
          if (!adjusted[newH]) adjusted[newH] = [];
          adjusted[newH].push(newM);
        }
      }
      for (const h in adjusted) {
        adjusted[h].sort((a, b) => a - b);
      }
      return adjusted;
    }

    // ==========================================
    const SEONYUDO_WEEKDAY = shiftScheduleDictEarlier({

    function isKoreanHoliday(date) {
      if (typeof window !== 'undefined' && typeof window.isKoreanHoliday === 'function') {
        return window.isKoreanHoliday(date);
      }
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const md = `${m}-${d}`;
      const fixed = ['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];
      return fixed.includes(md);
    }

    function isWeekendOrHoliday(date) {
      const day = date.getDay();
      return day === 0 || day === 6 || isKoreanHoliday(date);
    }

    /**
     * ODsay보다 우선 반영되는 역사 공식 고정 시간표 배차 계산 함수
     */
    function getPrioritizedTrains(now, isCommute, count = 2) {
      const isHoliday = isWeekendOrHoliday(now);
      let schedule;
      let defaultDest;
      let stationName;

      if (isCommute) {
        stationName = '선유도역';
        defaultDest = '중앙보훈병원';
        schedule = isHoliday ? SEONYUDO_WEEKEND : SEONYUDO_WEEKDAY;
      } else {
        stationName = '국회의사당역';
        defaultDest = '개화';
        schedule = isHoliday ? NATIONAL_ASSEMBLY_WEEKEND : NATIONAL_ASSEMBLY_WEEKDAY;
      }

      const rawH = now.getHours();
      // 0시는 지하철 당일 심야 운행 24시로 처리
      const currentH = (rawH === 0) ? 24 : rawH;
      const currentMinutes = currentH * 60 + now.getMinutes();
      const currentSec = now.getSeconds();
      const nowMs = now.getTime();

      const results = [];
      const hours = Object.keys(schedule).map(Number).sort((a, b) => a - b);

      for (const h of hours) {
        const mins = schedule[h];
        for (const m of mins) {
          const trainMin = h * 60 + m;
          const diffSec = (trainMin - currentMinutes) * 60 - currentSec;
          if (diffSec >= -30) {
            let dest = defaultDest;
            if (stationName === '국회의사당역') {
              if (h === 24 && m === 42) {
                dest = '마곡나루(종착)';
              } else if ((h === 24 && m === 53) || (h === 23 && m === 50 && isHoliday)) {
                dest = '염창(종착)';
              }
            } else if (stationName === '선유도역') {
              if (h === 24 && !isHoliday) {
                if (m === 18) dest = '삼전(종착)';
                else if (m === 30) dest = '신논현(종착)';
                else if (m === 43) dest = '동작(종착)';
                else if (m === 56) dest = '당산(종착)';
              } else if (h === 23 && isHoliday) {
                if (m === 27) dest = '신논현(종착)';
                else if (m === 41) dest = '동작(종착)';
                else if (m === 55) dest = '당산(종착)';
              }
            }

            const displayH = (h === 24) ? '00' : String(h).padStart(2, '0');
            const displayM = String(m).padStart(2, '0');

            results.push({
              departureTime: `${displayH}:${displayM}`,
              endStationName: dest,
              sec: Math.max(0, diffSec),
              remainSeconds: Math.max(0, diffSec),
              remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
              targetTime: nowMs + Math.max(0, diffSec) * 1000,
              source: '역고정시간표(우선)',
              subwayClass: 0
            });
            if (results.length >= count) break;
          }
        }
        if (results.length >= count) break;
      }

      // 만약 심야 운행 종료 시간대(01:00 ~ 04:59)라면 당일 아침 첫차 반환
      if (results.length === 0 && (rawH >= 1 && rawH < 5)) {
        const firstH = hours[0];
        const firstM = schedule[firstH][0];
        const displayH = String(firstH).padStart(2, '0');
        const displayM = String(firstM).padStart(2, '0');
        const firstTrainMin = firstH * 60 + firstM;
        const diffSec = (firstTrainMin - (rawH * 60 + now.getMinutes())) * 60 - currentSec;
        results.push({
          departureTime: `${displayH}:${displayM}`,
          endStationName: defaultDest,
          sec: Math.max(0, diffSec),
          remainSeconds: Math.max(0, diffSec),
          remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
          targetTime: nowMs + Math.max(0, diffSec) * 1000,
          source: '역고정시간표(첫차)',
          subwayClass: 0,
          isFirstTrain: true
        });
      }

      return results;
    }

    /**
     * "HH:MM:SS" 또는 "HH:MM" 형식의 시간 문자열에서 특정 분(minutes)만큼 앞당기는 유틸 함수
     */
    function shiftTimeEarlier(timeStr, minutesToShift = 1) {
      if (!timeStr || typeof timeStr !== 'string') return timeStr;

      const parts = timeStr.trim().split(':');
      if (parts.length < 2) return timeStr;

      let hours = parseInt(parts[0], 10);
      let minutes = parseInt(parts[1], 10);
      const seconds = parts.length > 2 ? parts[2] : null;

      if (isNaN(hours) || isNaN(minutes)) return timeStr;

      let totalMinutes = hours * 60 + minutes - minutesToShift;
      if (totalMinutes < 0) totalMinutes += 24 * 60;

      const newH = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
      const newM = String(totalMinutes % 60).padStart(2, '0');

      return seconds !== null ? `${newH}:${newM}:${seconds}` : `${newH}:${newM}`;
    }

    /**
     * API로 받아온 9호선 열차 목록 데이터의 시간을 일괄 1분씩 당기는 함수
     * @param {Array<Object>} timetableList - 지하철 시간표 목록
     * @returns {Array<Object>} - 1분 앞당겨진 시간표 목록
     */
    function adjustSubwaySchedule(timetableList) {
      if (!Array.isArray(timetableList)) return [];

      return timetableList.map((train) => {
        // API 필드명에 맞춰 보정 (예: arrtime, deptime, ARRIVETIME 등)
        const adjusted = { ...train };

        // 도착 시간 필드가 있는 경우 1분 차감
        if (adjusted.arrtime) {
          adjusted.arrtime = shiftTimeEarlier(adjusted.arrtime, 1);
        }
        if (adjusted.ARRIVETIME) {
          adjusted.ARRIVETIME = shiftTimeEarlier(adjusted.ARRIVETIME, 1);
        }

        // 출발 시간 필드가 있는 경우 1분 차감
        if (adjusted.deptime) {
          adjusted.deptime = shiftTimeEarlier(adjusted.deptime, 1);
        }
        if (adjusted.LEFTTIME) {
          adjusted.LEFTTIME = shiftTimeEarlier(adjusted.LEFTTIME, 1);
        }
        if (adjusted.departureTime) {
          adjusted.departureTime = shiftTimeEarlier(adjusted.departureTime, 1);
        }

        // 실시간 '도착 예정 잔여 초(barvlDt)' 데이터가 오는 경우 (단위: 초)
        if (adjusted.barvlDt !== undefined && !isNaN(Number(adjusted.barvlDt))) {
          const remainingSec = Number(adjusted.barvlDt);
          // 1분(60초) 차감하되 0초 미만이면 0(도착 진입)으로 고정
          adjusted.barvlDt = String(Math.max(0, remainingSec - 60));
        }

        // 잔여 초 및 목표 시각도 1분(60초) 차감 보정
        if (adjusted.sec !== undefined && !isNaN(Number(adjusted.sec))) {
          adjusted.sec = Math.max(0, Number(adjusted.sec) - 60);
          adjusted.remainSeconds = adjusted.sec;
          adjusted.remainMinutes = Math.floor(adjusted.sec / 60);
        }
        if (adjusted.targetTime !== undefined && !isNaN(Number(adjusted.targetTime))) {
          adjusted.targetTime = adjusted.targetTime - 60000;
        }

        return adjusted;
      });
    }

        : '💡 <b>[실시간 모드]</b> 서울시 공식 지하철 공공API로 열차번호 및 실시간 위치를 연동합니다. 시간표 시각으로 계산하시려면 상단 [🗓️ 시간표]를 누르세요.';

    /**
     * 3대 버스(양천01, 603, 6620) 중 특정 도착시각 이후 가장 빨리 탈 수 있는 최적 버스 선정
     */
    function findFastestBus(routes, busDataMap, reachTimeMs, now, nowMs) {
      const routeBestList = [];

      routes.forEach(r => {
        const item = busDataMap ? busDataMap[r.routeNum] : null;
        const { next, next2, next3 } = parseSeoulBus(r, item, now, nowMs);
        const headway = getRouteHeadwaySec(r.routeNum, now);

        // 노선의 실시간/시간표 버스 목록 수집
        const busList = [];
        if (next && next.targetTime && !next.isWait && !next.isEnd) {
          busList.push({ targetTime: next.targetTime, label: '다음', plainNo: next.plainNo || '' });
        }
        if (next2 && next2.targetTime && !next2.isWait && !next2.isEnd) {
          busList.push({ targetTime: next2.targetTime, label: '다다음', plainNo: next2.plainNo || '' });
        }
        if (next3 && next3.targetTime) {
          busList.push({ targetTime: next3.targetTime, label: '다다다음', plainNo: '' });
        }

        // 1. reachTimeMs 이후에 오는 버스가 이미 목록에 있다면 그 중 가장 이른 버스 찾기
        let candidate = busList.find(b => b.targetTime >= reachTimeMs);

        // 2. 만약 목록의 버스들이 모두 reachTimeMs 전에 지나가 버렸다면,
        // 마지막 버스 시간 기준으로 headway(배차간격)를 더해 reachTimeMs 이후 첫 버스 시각 투영
        if (!candidate) {
          let baseTimeMs = (busList.length > 0)
            ? busList[busList.length - 1].targetTime
            : nowMs;
          
          let count = 0;
          while (baseTimeMs < reachTimeMs && count < 20) {
            baseTimeMs += headway * 1000;
            count++;
          }

          candidate = {
            targetTime: baseTimeMs,
            label: count > 1 ? `차기 ${count}회차` : '차기 배차',
            plainNo: ''
          };
        }

        routeBestList.push({
          routeNum: r.routeNum,
          badgeClass: r.badgeClass,
          label: candidate.label,
          targetTime: candidate.targetTime,
          plainNo: candidate.plainNo || '',
          waitMin: Math.max(0, Math.round((candidate.targetTime - reachTimeMs) / 60000))
        });
      });

      // 3개 노선(양천01, 603, 6620) 중 탑승 시각(targetTime)이 가장 빠른 버스 선택!
      // 탑승 시각이 동일한 경우 배차간격이 가장 짧은 양천01 우선
      routeBestList.sort((a, b) => {
        if (a.targetTime !== b.targetTime) return a.targetTime - b.targetTime;
        if (a.routeNum === '양천01') return -1;
        if (b.routeNum === '양천01') return 1;
        return 0;
      });

      return routeBestList[0];
    }

    /**
     * 특정 도보 도착시각 이후 가장 빨리 탈 수 있는 지하철(실시간 or 역사시간표) 선정
     */
    function findFastestSubway(reachTimeMs, isCommute, isTimetableMode, t1, t2) {
      const reachDate = new Date(reachTimeMs);
      const trains = (typeof getPrioritizedTrains === 'function')
        ? getPrioritizedTrains(reachDate, isCommute, 8)
        : [];

      const ttTrain = (trains && trains.length > 0)
        ? trains.find(tr => tr.targetTime >= reachTimeMs) || trains[0]
        : null;

      // [1] 시간표 모드인 경우: 공식 역사 고정 시간표 정시 열차를 정확히 선택
      if (isTimetableMode) {
        if (ttTrain) {
          return {
            clockStr: ttTrain.departureTime,
            trainNo: '',
            targetTime: ttTrain.targetTime,
            isLive: false,
            modeTag: '정시 시간표'
          };
        }
      }

      // [2] 실시간 모드인 경우:
      // (A) 실시간 열차(t1, t2) 중 reachTimeMs 이후 탑승 가능한 열차가 있다면 즉시 선택
      const liveList = [];
      if (t1 && t1.targetTime && t1.targetTime >= reachTimeMs) liveList.push(t1);
      if (t2 && t2.targetTime && t2.targetTime >= reachTimeMs) liveList.push(t2);

      if (liveList.length > 0) {
        liveList.sort((a, b) => a.targetTime - b.targetTime);
        const sel = liveList[0];
        return {
          clockStr: sel.clockStr,
          trainNo: sel.trainNo || '',
          targetTime: sel.targetTime,
          isLive: true,
          modeTag: '실시간'
        };
      }

      // (B) 실시간 t1, t2가 이미 reachTimeMs 이전에 통과한 경우:
      // 실시간 열차가 시간표 대비 몇 분 지연(or 조기 도착) 운행 중인지 편차를 도출하여 역사 시간표에 연동!
      let liveDelayMs = 0;
      if (t1 && t1.targetTime) {
        const nowMs = Date.now();
        const t1RemainSec = Math.max(0, Math.round((t1.targetTime - nowMs) / 1000));
        const schedFirst = (typeof getPrioritizedTrains === 'function') ? getPrioritizedTrains(new Date(nowMs), isCommute, 1)?.[0] : null;
        if (schedFirst && schedFirst.targetTime) {
          const schedSec = Math.max(0, Math.round((schedFirst.targetTime - nowMs) / 1000));
          const diffSec = t1RemainSec - schedSec;
          // 실시간 지연 오차 (-2분 ~ +4분 클램프)
          liveDelayMs = Math.max(-120000, Math.min(240000, diffSec * 1000));
        }
      }

      if (ttTrain) {
        let adjTargetTime = ttTrain.targetTime + liveDelayMs;
        if (adjTargetTime < reachTimeMs) {
          const nextTt = trains.find(tr => tr.targetTime > ttTrain.targetTime);
          if (nextTt) adjTargetTime = nextTt.targetTime + liveDelayMs;
        }
        const adjDate = new Date(adjTargetTime);
        const adjClock = `${String(adjDate.getHours()).padStart(2, '0')}:${String(adjDate.getMinutes()).padStart(2, '0')}`;
        return {
          clockStr: adjClock,
          trainNo: (t1 && t1.trainNo) ? t1.trainNo : '',
          targetTime: adjTargetTime,
          isLive: true,
          modeTag: '실시간'
        };
      }

      // Fallback
      const fbMs = reachTimeMs + 4 * 60000;
      const d = new Date(fbMs);
      return {
        clockStr: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`,
        trainNo: '',
        targetTime: fbMs,
        isLive: false,
        modeTag: '예상'
      };
    }

    function renderEstimationBox(isCommute, busDataMap = null, t1 = null, t2 = null, isTimetableMode = false) {
      const box = document.getElementById('commuteEstimationSummaryBox');
      if (!box) return;

      const now = new Date();
      const nowMs = now.getTime();
      const config = BUS_CONFIGS[isCommute ? 'commute' : 'offwork'];

      const WALK_HOME_BUS = 8;             // 집 ↔ 6단지 버스정류장 (도보 8분)
      const WALK_BUS_SUBWAY_COMMUTE = 3;   // 선유도역 버스정류장 ➔ 선유도역 승차장 (도보 3분)
      const WALK_SEONYU_SUB_TO_BUS = 2.5;  // 선유도역 하차 ➔ 선유도역1번출구 버스정류장 (도보 2.5~3분 이내)
      const WALK_SUBWAY_OFFICE = 9;        // 국회의사당역 ↔ 회사 (도보 9분)
      const RIDE_BUS = 5;                  // 버스 이동 (5분)
      const RIDE_SUBWAY_COMMUTE = 3.5;     // 출근 9호선 승차 (선유도역 ➔ 국회의사당역: 약 3.5분)
      const RIDE_SUBWAY_OFFWORK = 2.5;     // 퇴근 9호선 승차 (국회의사당역 ➔ 선유도역: 약 2~2.5분 소요)

      const fmtTime = (d) => {
        if (!d) return '--:--';
        const h = String(d.getHours()).padStart(2, '0');

        return `${h}:${m}`;
      };

      const fmtClockFull = (d) => {
        if (!d) return '--:--';
        const h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? '오후' : '오전';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        const mStr = String(m).padStart(2, '0');
        return `${ampm} ${h12}시 ${mStr}분`;

      let est = null;

      if (isCommute) {
        // [출근] 집 ➔ 6단지 정류장 ➔ 선유도역 ➔ 국회의사당역 ➔ 회사
        const t0 = now;
        const t_reach_bus = new Date(nowMs + WALK_HOME_BUS * 60000);
        const chosenBus = findFastestBus(config.routes, busDataMap, t_reach_bus.getTime(), now, nowMs);
        const t_bus_board = new Date(chosenBus.targetTime);
        const busWaitMin = Math.max(0, Math.round((t_bus_board.getTime() - t_reach_bus.getTime()) / 60000));

        const t_reach_seonyu_bus = new Date(t_bus_board.getTime() + RIDE_BUS * 60000);
        const t_reach_seonyu_sub = new Date(t_reach_seonyu_bus.getTime() + WALK_BUS_SUBWAY_COMMUTE * 60000);

        const chosenTrain = findFastestSubway(t_reach_seonyu_sub.getTime(), true, isTimetableMode, t1, t2);
        const t_sub_board = new Date(chosenTrain.targetTime);
        const subWaitMin = Math.max(0, Math.round((t_sub_board.getTime() - t_reach_seonyu_sub.getTime()) / 60000));

        const t_reach_national_sub = new Date(t_sub_board.getTime() + RIDE_SUBWAY_COMMUTE * 60000);
        const t_final = new Date(t_reach_national_sub.getTime() + WALK_SUBWAY_OFFICE * 60000);
        const totalMinutes = Math.max(1, Math.round((t_final.getTime() - nowMs) / 60000));

        est = {
          mode: 'commute',
          startTime: t0,
          t_reach_bus,
          chosenBus,
          t_bus_board,
          busWaitMin,
          t_reach_seonyu_bus,
          t_reach_seonyu_sub,
          chosenTrain,
          t_sub_board,
          subWaitMin,
          t_reach_national_sub,
          t_final,
          totalMinutes
        };
      } else {
        // [퇴근] 회사 ➔ 국회의사당역 ➔ 선유도역 (지하철 2분여) ➔ 버스정류장 (도보 3분 이내) ➔ 3대 버스 중 최속 버스 연계 ➔ 집
        const t0 = now;
        const t_reach_national_sub = new Date(nowMs + WALK_SUBWAY_OFFICE * 60000);
        const chosenTrain = findFastestSubway(t_reach_national_sub.getTime(), false, isTimetableMode, t1, t2);
        const t_sub_board = new Date(chosenTrain.targetTime);
        const subWaitMin = Math.max(0, Math.round((t_sub_board.getTime() - t_reach_national_sub.getTime()) / 60000));

        // 국회의사당역 탑승 ➔ 선유도역 하차 (약 2.5분)
        const t_reach_seonyu_sub = new Date(t_sub_board.getTime() + RIDE_SUBWAY_OFFWORK * 60000);
        // 선유도역 하차 ➔ 선유도역1번출구 버스정류장 도착 (도보 약 2.5분 이내) => 지하철 탑승 후 총 5분 시점
        const t_reach_seonyu_bus = new Date(t_reach_seonyu_sub.getTime() + WALK_SEONYU_SUB_TO_BUS * 60000);

        // 선유도역 버스정류장 도착 시점(t_reach_seonyu_bus) 이후에 오는 양천01, 603, 6620 중 가장 빨리 오는 버스 배정
        const chosenBus = findFastestBus(config.routes, busDataMap, t_reach_seonyu_bus.getTime(), now, nowMs);
        const t_bus_board = new Date(chosenBus.targetTime);
        const busWaitMin = Math.max(0, Math.round((t_bus_board.getTime() - t_reach_seonyu_bus.getTime()) / 60000));

        const t_reach_bus = new Date(t_bus_board.getTime() + RIDE_BUS * 60000);
        const t_final = new Date(t_reach_bus.getTime() + WALK_HOME_BUS * 60000);
        const totalMinutes = Math.max(1, Math.round((t_final.getTime() - nowMs) / 60000));

        est = {
          mode: 'offwork',
          startTime: t0,
          t_reach_national_sub,
          chosenTrain,
          t_sub_board,
          subWaitMin,
          t_reach_seonyu_sub,
          t_reach_seonyu_bus,
          chosenBus,
          t_bus_board,
          busWaitMin,
          t_reach_bus,
          t_final,
          totalMinutes
        };
      }

      const totalMins = est.totalMinutes;
      const arrDate = est.t_final;

      const busPlateStr = est.chosenBus?.plainNo ? ` (${est.chosenBus.plainNo.slice(-4)})` : '';
      const busLabelBadge = `<b style="color:#0369a1;">${est.chosenBus.routeNum}</b> (${est.chosenBus.label}${busPlateStr})`;
      const subModeTag = isTimetableMode ? '[🗓️시간표]' : '[⚡실시간]';
      const trainLabelBadge = `<b style="color:#1d4ed8;">9호선 일반 (${est.chosenTrain.clockStr} 탑승 ${subModeTag})</b>`;

      const stepsHtml = isCommute ? `
        <div class="est-timeline-step">
          <div class="est-step-node start">🏠</div>
          <div class="est-step-content"><span class="est-step-name">집 출발</span><span class="est-step-clock">${fmtTime(est.startTime)}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 8분 (6단지 정류장 도착: ${fmtTime(est.t_reach_bus)})</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚌</div>
          <div class="est-step-content">
            <div>
              <div class="est-step-name">6단지 버스정류장 ➔ ${busLabelBadge}</div>
              <div class="est-step-detail">🚌 승차 (대기 약 ${est.busWaitMin}분 / 5분 이동)</div>
            </div>
            <span class="est-step-clock">${fmtTime(est.t_bus_board)} 탑승</span>
          </div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 3분 환승 (선유도역 도착: ${fmtTime(est.t_reach_seonyu_sub)})</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚇</div>
          <div class="est-step-content">
            <div>
              <div class="est-step-name">선유도역 승강장 ➔ ${trainLabelBadge}</div>
              <div class="est-step-detail">🚇 9호선 일반 (대기 약 ${est.subWaitMin}분 / 4분 이동)</div>
            </div>
            <span class="est-step-clock">${fmtTime(est.t_sub_board)} 탑승</span>
          </div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 9분 (국회의사당역 하차 ${fmtTime(est.t_reach_national_sub)} ➔ 회사)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node end">🎯</div>
          <div class="est-step-content est-final-step">
            <span class="est-step-name est-final-name">🏢 회사 도착 예정</span>
            <span class="est-step-clock highlight-arr-clock">${fmtClockFull(arrDate)}</span>
          </div>
        </div>
      ` : `
        <div class="est-timeline-step">
          <div class="est-step-node start">🏢</div>
          <div class="est-step-content"><span class="est-step-name">회사 출발</span><span class="est-step-clock">${fmtTime(est.startTime)}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 9분 (국회의사당역 도착: ${fmtTime(est.t_reach_national_sub)})</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚇</div>
          <div class="est-step-content">
            <div>
              <div class="est-step-name">국회의사당역 ➔ ${trainLabelBadge}</div>
              <div class="est-step-detail">🚇 9호선 일반 탑승 (대기 약 ${est.subWaitMin}분 / 2분여 이동)</div>
            </div>
            <span class="est-step-clock">${fmtTime(est.t_sub_board)} 탑승</span>
          </div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 선유도역 하차 ➔ 도보 2.5분 환승 (정류장 도착: ${fmtTime(est.t_reach_seonyu_bus)})</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚌</div>
          <div class="est-step-content">
            <div>
              <div class="est-step-name">선유도역1번출구 ➔ ${busLabelBadge}</div>
              <div class="est-step-detail">🚌 버스 승차 (대기 약 ${est.busWaitMin}분 / 5분 이동)</div>
            </div>
            <span class="est-step-clock">${fmtTime(est.t_bus_board)} 탑승</span>
          </div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 8분 (6단지 하차 ${fmtTime(est.t_reach_bus)} ➔ 집)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node end">🎯</div>
          <div class="est-step-content est-final-step">
            <span class="est-step-name est-final-name">🏠 집 도착 예정</span>
            <span class="est-step-clock highlight-arr-clock">${fmtClockFull(arrDate)}</span>
          </div>
        </div>
      `;

      const detailBox = document.getElementById('commuteEstimationDetailBox');

      box.innerHTML = `
        <div class="est-summary-card est-header-only-card">
          <div class="est-main-header">
            <div class="est-dest-title">
              <span class="est-dest-icon">${isCommute ? '🏢' : '🏠'}</span>
              <div class="est-dest-text">
                <div class="est-dep-time">지금(${fmtTime(now)}) 출발 기준 · ${isTimetableMode ? '🗓️ 지하철 시간표' : '⚡ 지하철 실시간'}</div>
                <div class="est-dest-label"><span class="est-total-min">${totalMins}분</span> 소요 예상</div>
              </div>
            </div>
            <div class="est-arr-box">
              <span class="est-arr-sub">도착 예정 시각</span>
              <span class="est-arr-time">${fmtClockFull(arrDate)}</span>
            </div>
          </div>
        </div>
      `;

      const detailHtml = `
        <div class="est-summary-card est-detail-timeline-card">
          <div class="est-detail-title-bar">
            <span>🧭 <b>${isCommute ? '출근' : '퇴근'} 이동 경로 및 최적 연계 시각표 (${isTimetableMode ? '🗓️ 시간표 모드' : '⚡ 실시간 모드'})</b></span>
            <span class="est-detail-badge">가장 빠른 연계 배정</span>
          </div>
          <div class="est-timeline-flow">${stepsHtml}</div>
          <div class="est-breakdown-bar">
            <span>💡 총 소요시간: 🚶 도보 20분 + 🚏 대기 ${est.busWaitMin + est.subWaitMin}분 + 🚍 승차 9분 = <b>총 ${totalMins}분 소요</b> (${isTimetableMode ? '🗓️ 9호선 공식 시간표 기준' : '⚡ 9호선 서울시 실시간 기준'})</span>
          </div>
        </div>
      `;

      if (detailBox) {
        detailBox.innerHTML = detailHtml;
      } else {
        box.querySelector('.est-summary-card').insertAdjacentHTML('beforeend', detailHtml);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      renderCards();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function shareKakaoLink() {
      const shareUrl = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('카카오톡 전송용 링크가 복사되었습니다! 💬');
        }).catch(() => {
          prompt('아래 링크를 복사하여 카카오톡에 붙여넣기 하세요:', shareUrl);
        });
      } else {
        prompt('아래 링크를 복사하여 카카오톡에 붙여넣기 하세요:', shareUrl);
      }
    }

    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('.live-cd').forEach(el => {
        const t = parseInt(el.getAttribute('data-time'), 10);
        if (!t || isNaN(t)) return;
        const diffSec = Math.max(0, Math.floor((t - now) / 1000));
        el.innerHTML = formatSec(diffSec);
      });

      // 30초 단위 자동 교정 카운트다운
      if (refreshCountdown > 0) {
        refreshCountdown--;
      }
      if (refreshCountdown <= 0) {
        refreshCountdown = REFRESH_INTERVAL;
        if (!document.hidden && !isFetching) {
          renderCards();
        }
      }
    }, 1000);

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerHTML = `${now.toLocaleTimeString('ko-KR')} <span style="color:#60a5fa; font-weight:700; margin-left:4px;">(교정 ${refreshCountdown}s)</span>`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    let lastResumeFetch = 0;
    const handleAppResume = () => {
      const now = Date.now();
      if (now - lastResumeFetch < 2500) return;
      lastResumeFetch = now;
      refreshCountdown = REFRESH_INTERVAL;
      renderCards();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) handleAppResume();
    });
    window.addEventListener('pageshow', () => {
      handleAppResume();
    });
    window.addEventListener('focus', () => {
      handleAppResume();
    });

    // 사용자 맞춤형 근무표 기반 출/퇴근 모드 자동 초기화
    // - 일근: 전날부터 09시까지 출근모드, 13시부터 퇴근모드
    // - 야근: 당일 07시부터 출근모드
    // - 조근: 당일 05시부터 퇴근모드
    try {
      const overrides = (typeof shiftStorage !== 'undefined') ? shiftStorage.getOverrides() : {};
      const baseSettings = (typeof shiftStorage !== 'undefined') ? shiftStorage.getBaseSettings() : {};
      if (typeof getCommuteModeForDateTime === 'function') {
        currentMode = getCommuteModeForDateTime(new Date(), overrides, baseSettings);
      } else {
        const initHour = new Date().getHours();
        currentMode = (initHour >= 7 && initHour < 13) ? 'commute' : 'offwork';
      }
    } catch (e) {
      console.warn('모드 초기화 실패, 기본 출근모드 적용:', e);
      currentMode = 'commute';
    }
    const tabCommuteEl = document.getElementById('tabCommute');
    const tabOffworkEl = document.getElementById('tabOffwork');
    if (tabCommuteEl && tabOffworkEl) {
      tabCommuteEl.className = `tab-btn ${currentMode === 'commute' ? 'active' : ''}`;
      tabOffworkEl.className = `tab-btn ${currentMode === 'offwork' ? 'active' : ''}`;
    }
    // 시간표 모달 시스템
    let activeTimetableTab = 'seonyudo';

    function openTimetableModal(tabType = 'subway') {
      if (tabType === 'subway') {
        activeTimetableTab = (currentMode === 'commute') ? 'seonyudo' : 'national';
      } else {
        activeTimetableTab = 'bus603';
      }
      ensureTimetableModal();
      renderTimetableModal();
      const modal = document.getElementById('transitTimetableModal');
      if (modal) {
        modal.style.display = 'flex';
      }
    }

    function closeTimetableModal() {
      const modal = document.getElementById('transitTimetableModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    function switchTimetableTab(tabKey) {
      activeTimetableTab = tabKey;
      renderTimetableModal();
    }

    function ensureTimetableModal() {
      if (document.getElementById('transitTimetableModal')) return;

      const modalHtml = `
        <div class="modal-overlay" id="transitTimetableModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.65); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:99999; justify-content:center; align-items:center; padding:16px;">
          <div class="modal-container" style="background:#ffffff; width:100%; max-width:440px; max-height:88vh; border-radius:18px; box-shadow:0 20px 40px rgba(0,0,0,0.25); display:flex; flex-direction:column; overflow:hidden; border:1px solid #e2e8f0;">
            <div class="modal-header" style="background:linear-gradient(135deg, #0f172a, #1e293b); color:#ffffff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:16px;">🗓️</span>
                <strong style="font-size:15px; font-weight:800;">대중교통 공식 운행 시간표</strong>
              </div>
              <button type="button" class="modal-close-btn" onclick="closeTimetableModal()" style="background:rgba(255,255,255,0.15); border:none; color:#ffffff; font-size:16px; width:28px; height:28px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
            </div>

            <div style="display:flex; background:#f1f5f9; border-bottom:1px solid #cbd5e1; padding:4px 6px; gap:4px; overflow-x:auto;" id="ttTabContainer">
            </div>

            <div class="modal-body" id="ttBodyContainer" style="padding:14px; overflow-y:auto; flex:1; font-size:12.5px; color:#334155;">
            </div>

            <div class="modal-footer" style="padding:10px 14px; background:#f8fafc; border-top:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:11px; color:#64748b;">💡 현재 시각 시간대는 노란색으로 강조됩니다.</span>
              <button type="button" class="btn-primary" onclick="closeTimetableModal()" style="background:#0284c7; color:#ffffff; border:none; padding:7px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:12px;">닫기</button>
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);

      const modalEl = document.getElementById('transitTimetableModal');
      if (modalEl) {
        modalEl.addEventListener('click', (e) => {
          if (e.target === modalEl) closeTimetableModal();
        });
      }
    }

    function renderTimetableModal() {
      const tabContainer = document.getElementById('ttTabContainer');
      const bodyContainer = document.getElementById('ttBodyContainer');
      if (!tabContainer || !bodyContainer) return;

      const currentTab = activeTimetableTab;
      const now = new Date();
      const curH = now.getHours();
      const isHoliday = isWeekendOrHoliday(now);

      const tabs = [
        { key: 'seonyudo', label: '🚇 9호선 선유도' },
        { key: 'national', label: '🚇 9호선 국회의사당' },
        { key: 'bus603', label: '🚌 603번 버스' },
        { key: 'bus6620', label: '🚌 6620번 버스' }
      ];

      tabContainer.innerHTML = tabs.map(t => {
        const active = (t.key === currentTab);
        return `
          <button type="button" onclick="switchTimetableTab('${t.key}')"
            style="flex:1; white-space:nowrap; padding:6px 8px; border-radius:6px; font-size:11px; font-weight:${active ? '800' : '600'}; border:none; background:${active ? '#0284c7' : 'transparent'}; color:${active ? '#ffffff' : '#475569'}; cursor:pointer; transition:all 0.15s;">
            ${t.label}
          </button>
        `;
      }).join('');

      let contentHtml = '';

      if (currentTab === 'seonyudo' || currentTab === 'national') {
        const isSeonyu = (currentTab === 'seonyudo');
        const title = isSeonyu ? '9호선 선유도역 (상행 당산·중앙보훈병원 방면 일반열차)' : '9호선 국회의사당역 (하행 당산·개화 방면 일반열차)';
        const sched = isSeonyu
          ? (isHoliday ? SEONYUDO_WEEKEND : SEONYUDO_WEEKDAY)
          : (isHoliday ? NATIONAL_ASSEMBLY_WEEKEND : NATIONAL_ASSEMBLY_WEEKDAY);

        const hours = Object.keys(sched).map(Number).sort((a, b) => a - b);

        contentHtml = `
          <div style="margin-bottom:10px; padding:8px 10px; background:#eff6ff; border-radius:8px; border:1px solid #bfdbfe; font-size:11.5px; color:#1e40af;">
            <strong>${title}</strong><br>
            <span style="font-size:11px; color:#3b82f6;">운행 구분: ${isHoliday ? '🌴 주말·공휴일 시간표' : '🗓️ 평일 시간표'} (1분 앞당김 정밀 보정판)</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${hours.map(h => {
              const mins = sched[h];
              const isCurHour = (h === curH || (h === 24 && curH === 0));
              return `
                <div style="display:flex; align-items:center; padding:5px 8px; border-radius:6px; background:${isCurHour ? '#fef3c7' : '#f8fafc'}; border:1px solid ${isCurHour ? '#fde68a' : '#e2e8f0'};">
                  <span style="width:50px; font-weight:800; color:${isCurHour ? '#b45309' : '#0f172a'}; font-size:12px;">${h === 24 ? '00' : String(h).padStart(2,'0')}시</span>
                  <div style="display:flex; flex-wrap:wrap; gap:4px; flex:1;">
                    ${mins.map(m => `
                      <span style="padding:1px 5px; border-radius:4px; background:#ffffff; border:1px solid ${isCurHour ? '#f59e0b' : '#cbd5e1'}; font-weight:700; font-size:11px; color:#1e293b;">
                        ${String(m).padStart(2,'0')}분
                      </span>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        const routeNum = (currentTab === 'bus603') ? '603' : '6620';
        const routeTitle = (currentTab === 'bus603') ? '간선 603번 (이대목동병원 15154)' : '지선 6620번 (이대목동병원 15154)';
        const ttData = (typeof BUS_TIMETABLE_15154 !== 'undefined') ? BUS_TIMETABLE_15154[routeNum] : null;

        if (ttData) {
          const dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
          const dayKey = dayNames[now.getDay()];
          const dayKo = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];

          const morningSched = ttData.morning?.schedules?.[dayKey] || [];
          const afternoonSched = ttData.afternoon?.schedules?.[dayKey] || [];

          contentHtml = `
            <div style="margin-bottom:10px; padding:8px 10px; background:#f0fdf4; border-radius:8px; border:1px solid #bbf7d0; font-size:11.5px; color:#166534;">
              <strong>${routeTitle}</strong><br>
              <span style="font-size:11px; color:#15803d;">기준: 오늘(${dayKo}요일) 정시 기준 운행표</span>
            </div>

            <div style="margin-bottom:10px;">
              <div style="font-weight:800; font-size:12px; margin-bottom:4px; color:#0f172a;">🌅 아침 출근 시간대</div>
              <div style="display:flex; flex-wrap:wrap; gap:4px;">
                ${morningSched.length > 0 ? morningSched.map(item => `
                  <span style="padding:3px 7px; border-radius:5px; background:#f8fafc; border:1px solid #cbd5e1; font-weight:700; font-size:11.5px;">${item.time}</span>
                `).join('') : '<span style="color:#94a3b8;">시간표 정보 없음</span>'}
              </div>
            </div>

            <div>
              <div style="font-weight:800; font-size:12px; margin-bottom:4px; color:#0f172a;">🌆 오후/저녁 시간대</div>
              <div style="display:flex; flex-wrap:wrap; gap:4px;">
                ${afternoonSched.length > 0 ? afternoonSched.map(item => `
                  <span style="padding:3px 7px; border-radius:5px; background:#f8fafc; border:1px solid #cbd5e1; font-weight:700; font-size:11.5px;">${item.time}</span>
                `).join('') : '<span style="color:#94a3b8;">시간표 정보 없음</span>'}
              </div>
            </div>
          `;
        } else {
          contentHtml = `<div style="padding:16px; text-align:center; color:#94a3b8;">시간표 데이터 준비 중</div>`;
        }
      }

      bodyContainer.innerHTML = contentHtml;
    }

    window.openTimetableModal = openTimetableModal;
    window.closeTimetableModal = closeTimetableModal;
    window.switchTimetableTab = switchTimetableTab;

    renderCards();
  </script>
</body>
</html>
