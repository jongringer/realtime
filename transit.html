  <script>
    const SEOUL_BUS_KEY = 'df332cd23ac6df535a295747d46e0328dd0fd3faed11cec584c87a0ca1e7a759';
    let currentMode = 'commute';
    let autoReason = '';
    const REFRESH_INTERVAL = 25;
    let refreshCountdown = 25;
    let isFetching = false;

    const BUS_CONFIGS = {
      commute: {
        arsId: '15-154',
        stId: '114000052',
        stationName: '이대목동병원·목동6단지앞',
        destNote: '선유도역·당산역 방면',
        routes: [
          { routeNum: '양천01', busRouteId: '114900001', stId: '114000052', ord: '17', badgeClass: 'badge-seoul-town', typeText: '마을버스 (배차 6~7분)', headway: 390 },
          { routeNum: '603',   busRouteId: '100100088', stId: '114000052', ord: '22', badgeClass: 'badge-seoul-blue', typeText: '간선버스 (배차 10~12분)', headway: 660 },
          { routeNum: '6620',  busRouteId: '100100300', stId: '114000052', ord: '28', badgeClass: 'badge-seoul-green', typeText: '지선버스 (당산역 방면)', headway: 720 }
        ]
      },
      offwork: {
        arsId: '19-210',
        stId: '118000125',
        stationName: '선유도역1번출구·한신아파트',
        destNote: '목동아파트 단지 방면 환승',
        routes: [
          { routeNum: '양천01', busRouteId: '114900001', stId: '118000125', ord: '20', badgeClass: 'badge-seoul-town', typeText: '마을버스 (배차 6~7분)', headway: 390 },
          { routeNum: '603',   busRouteId: '100100088', stId: '118000125', ord: '62', badgeClass: 'badge-seoul-blue', typeText: '간선버스 (배차 10~12분)', headway: 660 },
          { routeNum: '6620',  busRouteId: '100100300', stId: '118000125', ord: '34', badgeClass: 'badge-seoul-green', typeText: '지선버스 (차고지 방면)', headway: 720 }
        ]
      }
    };

    const busCache = {};

    function formatSec(sec) {
      if (sec <= 0) return '<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>';
      if (sec < 60) return `<span style="color:#dc2626; font-weight:900;">${sec}초 후</span>`;
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const sStr = s < 10 ? '0' + s : s;
      return `<span class="transit-time-min">${m}분</span> <span class="transit-time-sec">${sStr}초 후</span>`;
    }

    async function fetchSeoulBusArrival(busRouteId, stId, ord) {
      const cacheKey = `${busRouteId}_${stId}_${ord}`;
      const directUrl = `http://ws.bus.go.kr/api/rest/arrive/getArrInfoByRoute?serviceKey=${SEOUL_BUS_KEY}&busRouteId=${busRouteId}&stId=${stId}&ord=${ord}&resultType=json`;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);
        const res = await fetch(directUrl, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          const item = data?.msgBody?.itemList?.[0];
          if (item) {
            busCache[cacheKey] = item;
            return item;
          }
        }
      } catch (e) {}

      const proxies = [
        url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        url => `https://corsproxy.io/?${encodeURIComponent(url)}`
      ];

      for (const makeProxy of proxies) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const proxyUrl = makeProxy(directUrl);
          const res = await fetch(proxyUrl, { cache: 'no-store', signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            const item = data?.msgBody?.itemList?.[0];
            if (item) {
              busCache[cacheKey] = item;
              return item;
            }
          }
        } catch (err) {}
      }

      return busCache[cacheKey] || null;
    }

    function parseSeoulBus(routeConfig, busItem, now, nowMs) {
      const headway = routeConfig.headway;
      const targetOrd = parseInt(routeConfig.ord, 10);
      let next = null;
      let next2 = null;

      if (busItem) {
        const traTime1 = parseInt(busItem.traTime1 || '0', 10);
        const sectOrd1 = parseInt(busItem.sectOrd1 || '0', 10);
        const arrmsg1 = (busItem.arrmsg1 || '').trim();
        const plainNo1 = (busItem.plainNo1 || '').trim();

        const traTime2 = parseInt(busItem.traTime2 || '0', 10);
        const sectOrd2 = parseInt(busItem.sectOrd2 || '0', 10);
        const arrmsg2 = (busItem.arrmsg2 || '').trim();
        const plainNo2 = (busItem.plainNo2 || '').trim();

        let stop1Text = '';
        const m1 = arrmsg1.match(/\[(\d+)번째\s*전\]/);
        if (m1) stop1Text = `[${m1[1]}번째 전]`;
        else if (sectOrd1 > 0 && targetOrd > sectOrd1) stop1Text = `[${targetOrd - sectOrd1}번째 전]`;

        const isArrivingSoon1 = arrmsg1.includes('곧 도착');
        const isWait1 = arrmsg1.includes('출발대기');
        const isEnd1 = arrmsg1.includes('운행종료');

        let sec1 = traTime1;
        if (isArrivingSoon1) sec1 = Math.min(sec1 > 0 ? sec1 : 30, 45);

        next = {
          sec: sec1,
          arrmsg: arrmsg1,
          stopText: stop1Text,
          plainNo: plainNo1,
          isArrivingSoon: isArrivingSoon1,
          isWait: isWait1,
          isEnd: isEnd1,
          targetTime: (sec1 > 0) ? (nowMs + sec1 * 1000) : null
        };

        let stop2Text = '';
        const m2 = arrmsg2.match(/\[(\d+)번째\s*전\]/);
        if (m2) stop2Text = `[${m2[1]}번째 전]`;
        else if (sectOrd2 > 0 && targetOrd > sectOrd2) stop2Text = `[${targetOrd - sectOrd2}번째 전]`;

        const isWait2 = arrmsg2.includes('출발대기');
        const isEnd2 = arrmsg2.includes('운행종료');
        const isArrivingSoon2 = arrmsg2.includes('곧 도착');

        if (traTime2 > 0 || isWait2 || isArrivingSoon2) {
          let sec2 = traTime2;
          if (isArrivingSoon2) sec2 = Math.min(sec2 > 0 ? sec2 : 45, 60);

          next2 = {
            sec: sec2,
            arrmsg: arrmsg2,
            stopText: stop2Text,
            plainNo: plainNo2,
            isWait: isWait2,
            isEnd: isEnd2,
            targetTime: (sec2 > 0) ? (nowMs + sec2 * 1000) : null
          };
        } else if (sec1 > 0 && !isWait1 && !isEnd1) {
          const next2Sec = sec1 + headway;
          next2 = {
            sec: next2Sec,
            arrmsg: '배차 간격 운행',
            stopText: '차기 순번',
            plainNo: '',
            isWait: false,
            isEnd: false,
            targetTime: nowMs + next2Sec * 1000
          };
        }
      }

      if (!next) {
        const curSecInHour = now.getMinutes() * 60 + now.getSeconds();
        const cycleOffset = headway - (curSecInHour % headway);
        next = {
          sec: cycleOffset,
          arrmsg: '정규 배차순번',
          stopText: '정규 배차',
          plainNo: '',
          isArrivingSoon: false,
          isWait: false,
          isEnd: false,
          targetTime: nowMs + cycleOffset * 1000
        };
        const next2Sec = cycleOffset + headway;
        next2 = {
          sec: next2Sec,
          arrmsg: '차기 배차순번',
          stopText: '차기 순번',
          plainNo: '',
          isWait: false,
          isEnd: false,
          targetTime: nowMs + next2Sec * 1000
        };
      }

      // 15154 정류소(이대목동병원) 6620 / 603번 버스 최우선 운행 시간표 데이터 확인
      const prioritySchedule = (typeof getPriorityBusSchedule === 'function')
        ? getPriorityBusSchedule(routeConfig.routeNum, (routeConfig.stId === '114000052' || routeConfig.arsId === '15-154') ? '15154' : '', now)
        : null;

      if (prioritySchedule && prioritySchedule.next) {
        const pNext = prioritySchedule.next;
        const pNext2 = prioritySchedule.next2;

        const isImminent = pNext.diffSec <= 35;
        const livePlate1 = (busItem && busItem.plainNo1) ? busItem.plainNo1 : '';

        next = {
          sec: pNext.diffSec,
          rawSec: pNext.diffSec,
          arrmsg: `${pNext.time} 정시운행`,
          stopText: isImminent ? '정류소 진입 중' : `정시 시간표 (${prioritySchedule.periodName})`,
          plainNo: livePlate1,
          isArrivingSoon: isImminent,
          isWait: false,
          isEnd: false,
          targetTime: pNext.targetTime,
          isPriority: true,
          priorityTime: pNext.time,
          periodName: prioritySchedule.periodName
        };

        if (pNext2) {
          const livePlate2 = (busItem && busItem.plainNo2) ? busItem.plainNo2 : '';
          next2 = {
            sec: pNext2.diffSec,
            rawSec: pNext2.diffSec,
            arrmsg: `${pNext2.time} 정시운행`,
            stopText: `차기 순번 (${pNext2.time})`,
            plainNo: livePlate2,
            isWait: false,
            isEnd: false,
            targetTime: pNext2.targetTime,
            isPriority: true,
            priorityTime: pNext2.time
          };
        }
      }

      return { next, next2 };
    }

    /**
     * 시간표 딕셔너리의 모든 분(minute)을 minutesToShift(1분)만큼 일괄 앞당기는 헬퍼
     */
    function shiftScheduleDictEarlier(scheduleDict, minutesToShift = 1) {
      const adjusted = {};
      for (const [hStr, mins] of Object.entries(scheduleDict)) {
        const h = Number(hStr);
        for (const m of mins) {
          let totalMin = h * 60 + m - minutesToShift;
          if (totalMin < 0) totalMin += 24 * 60;
          const newH = Math.floor(totalMin / 60) % 24;
          const newM = totalMin % 60;
          if (!adjusted[newH]) adjusted[newH] = [];
          adjusted[newH].push(newM);
        }
      }
      for (const h in adjusted) {
        adjusted[h].sort((a, b) => a - b);
      }
      return adjusted;
    }

    const SEONYUDO_WEEKDAY = shiftScheduleDictEarlier({

    function isKoreanHoliday(date) {
      if (typeof window !== 'undefined' && typeof window.isKoreanHoliday === 'function') {
        return window.isKoreanHoliday(date);
      }
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const md = `${m}-${d}`;
      const fixed = ['01-01','03-01','05-05','06-06','08-15','10-03','10-09','12-25'];
      return fixed.includes(md);
    }

    function isWeekendOrHoliday(date) {
      const day = date.getDay();
      return day === 0 || day === 6 || isKoreanHoliday(date);
    }

    /**
     * ODsay보다 우선 반영되는 역사 공식 고정 시간표 배차 계산 함수
     */
    function getPrioritizedTrains(now, isCommute, count = 2) {
      const isHoliday = isWeekendOrHoliday(now);
      let schedule;
      let defaultDest;
      let stationName;

      if (isCommute) {
        stationName = '선유도역';
        defaultDest = '중앙보훈병원';
        schedule = isHoliday ? SEONYUDO_WEEKEND : SEONYUDO_WEEKDAY;
      } else {
        stationName = '국회의사당역';
        defaultDest = '개화';
        schedule = isHoliday ? NATIONAL_ASSEMBLY_WEEKEND : NATIONAL_ASSEMBLY_WEEKDAY;
      }

      const rawH = now.getHours();
      // 0시는 지하철 당일 심야 운행 24시로 처리
      const currentH = (rawH === 0) ? 24 : rawH;
      const currentMinutes = currentH * 60 + now.getMinutes();
      const currentSec = now.getSeconds();
      const nowMs = now.getTime();

      const results = [];
      const hours = Object.keys(schedule).map(Number).sort((a, b) => a - b);

      for (const h of hours) {
        const mins = schedule[h];
        for (const m of mins) {
          const trainMin = h * 60 + m;
          const diffSec = (trainMin - currentMinutes) * 60 - currentSec;
          if (diffSec >= -30) {
            let dest = defaultDest;
            if (stationName === '국회의사당역') {
              if (h === 24 && m === 42) {
                dest = '마곡나루(종착)';
              } else if ((h === 24 && m === 53) || (h === 23 && m === 50 && isHoliday)) {
                dest = '염창(종착)';
              }
            } else if (stationName === '선유도역') {
              if (h === 24 && !isHoliday) {
                if (m === 18) dest = '삼전(종착)';
                else if (m === 30) dest = '신논현(종착)';
                else if (m === 43) dest = '동작(종착)';
                else if (m === 56) dest = '당산(종착)';
              } else if (h === 23 && isHoliday) {
                if (m === 27) dest = '신논현(종착)';
                else if (m === 41) dest = '동작(종착)';
                else if (m === 55) dest = '당산(종착)';
              }
            }

            const displayH = (h === 24) ? '00' : String(h).padStart(2, '0');
            const displayM = String(m).padStart(2, '0');

            results.push({
              departureTime: `${displayH}:${displayM}`,
              endStationName: dest,
              sec: Math.max(0, diffSec),
              remainSeconds: Math.max(0, diffSec),
              remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
              targetTime: nowMs + Math.max(0, diffSec) * 1000,
              source: '역고정시간표(우선)',
              subwayClass: 0
            });
            if (results.length >= count) break;
          }
        }
        if (results.length >= count) break;
      }

      // 만약 심야 운행 종료 시간대(01:00 ~ 04:59)라면 당일 아침 첫차 반환
      if (results.length === 0 && (rawH >= 1 && rawH < 5)) {
        const firstH = hours[0];
        const firstM = schedule[firstH][0];
        const displayH = String(firstH).padStart(2, '0');
        const displayM = String(firstM).padStart(2, '0');
        const firstTrainMin = firstH * 60 + firstM;
        const diffSec = (firstTrainMin - (rawH * 60 + now.getMinutes())) * 60 - currentSec;
        results.push({
          departureTime: `${displayH}:${displayM}`,
          endStationName: defaultDest,
          sec: Math.max(0, diffSec),
          remainSeconds: Math.max(0, diffSec),
          remainMinutes: Math.floor(Math.max(0, diffSec) / 60),
          targetTime: nowMs + Math.max(0, diffSec) * 1000,
          source: '역고정시간표(첫차)',
          subwayClass: 0,
          isFirstTrain: true
        });
      }

      return results;
    }

    /**
     * "HH:MM:SS" 또는 "HH:MM" 형식의 시간 문자열에서 특정 분(minutes)만큼 앞당기는 유틸 함수
     */
    function shiftTimeEarlier(timeStr, minutesToShift = 1) {
      if (!timeStr || typeof timeStr !== 'string') return timeStr;

      const parts = timeStr.trim().split(':');
      if (parts.length < 2) return timeStr;

      let hours = parseInt(parts[0], 10);
      let minutes = parseInt(parts[1], 10);
      const seconds = parts.length > 2 ? parts[2] : null;

      if (isNaN(hours) || isNaN(minutes)) return timeStr;

      let totalMinutes = hours * 60 + minutes - minutesToShift;
      if (totalMinutes < 0) totalMinutes += 24 * 60;

      const newH = String(Math.floor(totalMinutes / 60) % 24).padStart(2, '0');
      const newM = String(totalMinutes % 60).padStart(2, '0');

      return seconds !== null ? `${newH}:${newM}:${seconds}` : `${newH}:${newM}`;
    }

    /**
     * API로 받아온 9호선 열차 목록 데이터의 시간을 일괄 1분씩 당기는 함수
     * @param {Array<Object>} timetableList - 지하철 시간표 목록
     * @returns {Array<Object>} - 1분 앞당겨진 시간표 목록
     */
    function adjustSubwaySchedule(timetableList) {
      if (!Array.isArray(timetableList)) return [];

      return timetableList.map((train) => {
        // API 필드명에 맞춰 보정 (예: arrtime, deptime, ARRIVETIME 등)
        const adjusted = { ...train };

        // 도착 시간 필드가 있는 경우 1분 차감
        if (adjusted.arrtime) {
          adjusted.arrtime = shiftTimeEarlier(adjusted.arrtime, 1);
        }
        if (adjusted.ARRIVETIME) {
          adjusted.ARRIVETIME = shiftTimeEarlier(adjusted.ARRIVETIME, 1);
        }

        // 출발 시간 필드가 있는 경우 1분 차감
        if (adjusted.deptime) {
          adjusted.deptime = shiftTimeEarlier(adjusted.deptime, 1);
        }
        if (adjusted.LEFTTIME) {
          adjusted.LEFTTIME = shiftTimeEarlier(adjusted.LEFTTIME, 1);
        }
        if (adjusted.departureTime) {
          adjusted.departureTime = shiftTimeEarlier(adjusted.departureTime, 1);
        }

        // 실시간 '도착 예정 잔여 초(barvlDt)' 데이터가 오는 경우 (단위: 초)
        if (adjusted.barvlDt !== undefined && !isNaN(Number(adjusted.barvlDt))) {
          const remainingSec = Number(adjusted.barvlDt);
          // 1분(60초) 차감하되 0초 미만이면 0(도착 진입)으로 고정
          adjusted.barvlDt = String(Math.max(0, remainingSec - 60));
        }

        // 잔여 초 및 목표 시각도 1분(60초) 차감 보정
        if (adjusted.sec !== undefined && !isNaN(Number(adjusted.sec))) {
          adjusted.sec = Math.max(0, Number(adjusted.sec) - 60);
          adjusted.remainSeconds = adjusted.sec;
          adjusted.remainMinutes = Math.floor(adjusted.sec / 60);
        }
        if (adjusted.targetTime !== undefined && !isNaN(Number(adjusted.targetTime))) {
          adjusted.targetTime = adjusted.targetTime - 60000;
        }

        return adjusted;
      });
    }

          nextSubLoc = `상태: <b>오늘 운행종료</b>`;
        } else if (next.isArrivingSoon || next.sec <= 30) {
          nextTimeHtml = `<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>`;
          const loc = next.stopText ? `${next.stopText} · 진입 중` : '정류소 진입 중';
          nextSubLoc = `위치: <b>${loc}</b>`;
        } else if (next.targetTime) {
          nextTimeHtml = `<span class="live-cd" data-time="${next.targetTime}" style="font-size:13.5px; font-weight:800; white-space:nowrap;">${formatSec(next.sec)}</span>`;
          nextSubLoc = `위치: <b>${next.stopText || '운행 중'}</b>`;
        } else {
          nextTimeHtml = `<span style="color:#dc2626; font-weight:900;">⚡ 곧 도착</span>`;
          nextSubLoc = `위치: <b>운행 중</b>`;
        }

        let nextArrClock = '';
        let nextScheduleBadge = '';
        if (next.isPriority && next.priorityTime) {
          nextArrClock = next.priorityTime;
          nextScheduleBadge = `<span style="display:inline-flex; align-items:center; background:#fef3c7; color:#92400e; font-size:10px; padding:1px 5px; border-radius:4px; font-weight:800; margin-left:4px; border:1px solid #fde68a;">🗓️ 공식 시간표</span>`;
        } else if (next.targetTime && !next.isWait && !next.isEnd) {
          const nextArrTime = new Date(next.targetTime);
          nextArrClock = `${String(nextArrTime.getHours()).padStart(2, '0')}:${String(nextArrTime.getMinutes()).padStart(2, '0')}`;
        }

        const vehicleBadge1 = next.plainNo ? `<span class="badge-bus-plate" style="display:inline-flex; align-items:center; background:#f1f5f9; color:#334155; font-size:10.5px; padding:1px 5px; border-radius:4px; font-weight:700; margin-left:6px; border:1px solid #cbd5e1;">🚌 ${next.plainNo}</span>` : '';

        const nextHtml = `
          <div class="next-transit-box" style="padding:7px 10px;">
            <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; white-space:nowrap;">
              <span class="next-tag-red" style="font-size:11px; white-space:nowrap;">
                <span>🔴</span> <span>다음 버스</span>
                ${vehicleBadge1}
              </span>
              <span class="next-time-big" style="font-size:13.5px; font-weight:800; white-space:nowrap;">
                ${nextTimeHtml}
              </span>
            </div>
            <div class="next-transit-sub" style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #bae6fd; padding-top:4px; margin-top:4px;">
              <span>${nextSubLoc}</span>
              ${nextArrClock ? `<span class="transit-sub-time"><span class="transit-arr-label" style="font-size:12.5px; font-weight:800;">도착 예정:</span> <b class="transit-clock-time" style="font-size:16px; font-weight:900; color:#0369a1;">${nextArrClock}</b></span>` : ''}
            </div>
          </div>
        `;

        let next2Html = '';
        if (next2) {
          let next2TimeHtml = '';
          let next2SubText = '';

          if (next2.isWait) {
            next2TimeHtml = `<span style="color:#d97706; font-weight:700;">출발대기</span>`;
            next2SubText = '차고지 대기';
          } else if (next2.isEnd) {
            next2TimeHtml = `<span style="color:#64748b; font-weight:700;">운행종료</span>`;
            next2SubText = '종료';
          } else if (next2.targetTime) {
            const next2ArrTime = new Date(next2.targetTime);
            const next2Clock = next2.priorityTime || `${String(next2ArrTime.getHours()).padStart(2, '0')}:${String(next2ArrTime.getMinutes()).padStart(2, '0')}`;
            next2TimeHtml = `<span class="live-cd" data-time="${next2.targetTime}" style="font-weight:800; color:#1e40af; font-size:12px;">${formatSec(next2.sec)}</span>`;
            const p2Tag = next2.isPriority ? ` <span style="font-size:9.5px; color:#b45309; font-weight:700;">[시간표]</span>` : '';
            next2SubText = `<b class="transit-clock-time" style="font-size:15px; font-weight:900; color:#1d4ed8;">${next2Clock}</b>${p2Tag}${next2.stopText ? ` · ${next2.stopText}` : ''}`;
          }

          const vehicleBadge2 = next2.plainNo ? `<span style="font-size:10px; color:#475569; font-weight:600; margin-left:4px;">(${next2.plainNo})</span>` : '';

          next2Html = `
            <div class="next2-transit-box" style="padding:6px 10px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center;">
              <span class="next2-tag-blue" style="font-size:12px; white-space:nowrap;">
                <span>🔵 다다음 (${next2SubText}):${vehicleBadge2}</span>
              </span>
              ${next2TimeHtml}
            </div>
          `;
        }

        return `
          <div class="bit-route-item" style="padding:8px 10px;">
            <div class="bit-route-top" style="margin-bottom:4px;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span class="${r.badgeClass}">${r.routeNum}</span>
                <span style="font-size:10.5px; color:#64748b; font-weight:600;">${r.typeText}</span>
                ${nextScheduleBadge}
              </div>
            </div>
            ${nextHtml}
            ${next2Html}
          </div>
        `;
      }).join('');

      const busHtml = `
        <div class="bit-board-card">
          <div class="bit-header-row">
            <div class="bit-title-group">
              <span class="bit-ars-badge">ARS ${config.arsId}</span>
              <strong class="bit-station-name">${config.stationName}</strong>
            </div>
            <span class="bit-status-live"><span class="bit-status-dot"></span> 서울시 실시간</span>
          </div>
          <div class="bit-desc-row" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            <span>📍 정류소 실시간 도착 현황</span>
            <span class="bit-dest-pill">${config.destNote}</span>
          </div>
          <div class="bit-route-list">${busRows}</div>
          <div class="bit-footer-info">
            <span>💡 서울시 버스도착정보 공식 API(TOPIS) 연동으로 실시간 카운트다운됩니다.</span>
          </div>
        </div>
      `;

      // 2. 지하철 도착 정보 (역사 고정 시간표 100% 반영)
      const subStName = isCommute ? '선유도역 9호선 [상행]' : '국회의사당역 9호선 [하행]';
      const subDir = isCommute ? '당산·중앙보훈병원 방면' : '당산·개화 방면 (선유도역 방향)';

      let subScheduleHtml = '';
      const isHolidayToday = isWeekendOrHoliday(now);
      const dayTypeLabel = isHolidayToday ? '🌴 주말·공휴일 시간표' : '🗓️ 평일 시간표';

      const prioritizedTrains = getPrioritizedTrains(now, isCommute, 2);

      if (prioritizedTrains && prioritizedTrains.length > 0) {
        const t1 = prioritizedTrains[0];
        const t2 = prioritizedTrains.length > 1 ? prioritizedTrains[1] : null;

        let t2Html = '';
        if (t2) {
          t2Html = `
            <div class="next2-transit-box" style="padding:6px 10px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center;">
              <span class="next2-tag-blue" style="font-size:12px; white-space:nowrap;">
                <span>🔵 다다음 (<b class="transit-clock-time" style="font-size:15px; font-weight:900; color:#78350f;">${t2.departureTime}</b> · ${t2.endStationName}행):</span>
              </span>
              <span class="live-cd" data-time="${t2.targetTime}" style="font-weight:800; color:#1e40af; font-size:12px;">
                ${formatSec(t2.sec)}
              </span>
            </div>
          `;
        }

        subScheduleHtml = `
          <div class="next-transit-box" style="padding:7px 10px;">
            <div class="next-transit-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; white-space:nowrap;">
              <span class="next-tag-red" style="font-size:11px; white-space:nowrap;">
                <span>🔴</span> <span>다음 열차</span>
                <span class="badge-low-bus" style="background:#fef3c7; color:#b45309; border-color:#fde68a;">역고정(공식)</span>
              </span>
              <span class="next-time-big live-cd" data-time="${t1.targetTime}" style="font-size:13.5px; font-weight:800; white-space:nowrap;">
                ${formatSec(t1.sec)}
              </span>
            </div>
            <div class="next-transit-sub" style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center; border-top:1px dashed #bae6fd; padding-top:4px; margin-top:4px;">
              <span class="transit-sub-time"><span class="transit-arr-label" style="font-size:12.5px; font-weight:800;">출발:</span> <b class="transit-clock-time" style="font-size:16px; font-weight:900; color:#78350f;">${t1.departureTime}</b> <span style="font-size:11px; font-weight:600;">(${t1.endStationName}행)</span></span>
              <span>${isCommute ? '선유도역 탑승' : '국회의사당역 탑승'} · 고정시간표</span>
            </div>
          </div>
          ${t2Html}
        `;
      } else {
        subScheduleHtml = `
          <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; font-size:12.5px; color:#64748b;">
            9호선 역사 고정 시간표 운행 준비 중
          </div>
        `;
      }

      const subHtml = `
        <div class="bit-board-card subway-9-card">
          <div class="bit-header-row">
            <div class="bit-title-group">
              <span class="badge-seoul-subway">9호선</span>
              <strong class="bit-station-name">${subStName}</strong>
            </div>
            <div style="display:flex; align-items:center; gap:5px;">
              <span class="bit-status-live" style="background:#ecfdf5; color:#047857; border-color:#a7f3d0;"><span class="bit-status-dot" style="background:#10b981;"></span> 역사시간표 정밀연동</span>
              <span class="subway-day-type-badge">${dayTypeLabel}</span>
            </div>
          </div>
          <div class="bit-desc-row">
            <span>방면: <b>${subDir}</b></span>
            <span class="bit-dest-pill">${isCommute ? '선유도역 탑승' : '국회의사당역 탑승'}</span>
          </div>
          <div style="margin-top:6px;">${subScheduleHtml}</div>
          <div class="bit-footer-info" style="margin-top:8px;">
            <span>💡 9호선 일반열차는 역사 공식 고정 시간표를 100% 반영하여 초 단위로 정확히 카운트다운합니다.</span>
          </div>
        </div>
      `;

      if (isCommute) {
        container.innerHTML = busHtml + subHtml;
      } else {
        container.innerHTML = subHtml + busHtml;
      }

      renderEstimationBox(isCommute);
    }

    function renderEstimationBox(isCommute) {
      const box = document.getElementById('commuteEstimationSummaryBox');
      if (!box) return;

      const now = new Date();
      const nowMs = now.getTime();
      const WALK_HOME_BUS = 8;
      const WALK_BUS_SUBWAY = 3;
      const WALK_SUBWAY_OFFICE = 9;
      const RIDE_BUS = 5;
      const RIDE_SUBWAY = 4;
      const WAIT_EST = 5;

      const totalMins = WALK_HOME_BUS + WALK_BUS_SUBWAY + WALK_SUBWAY_OFFICE + RIDE_BUS + RIDE_SUBWAY + WAIT_EST;
      const arrDate = new Date(nowMs + totalMins * 60 * 1000);

      const fmtTime = (d) => {
        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
      };

      const fmtClockFull = (d) => {
        const h = d.getHours();
        const m = d.getMinutes();
        const ampm = h >= 12 ? '오후' : '오전';
        const h12 = h % 12 === 0 ? 12 : h % 12;
        const mStr = String(m).padStart(2, '0');
        return `${ampm} ${h12}시 ${mStr}분`;
      };

      const destName = isCommute ? '회사' : '집';
      const stepsHtml = isCommute ? `
        <div class="est-timeline-step">
          <div class="est-step-node start">🏠</div>
          <div class="est-step-content"><span class="est-step-name">집 출발</span><span class="est-step-clock">${fmtTime(now)}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 8분 (6단지 정류장)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚌</div>
          <div class="est-step-content"><div><div class="est-step-name">6단지 버스정류장</div><div class="est-step-detail">🚌 버스 승차 (5분 이동)</div></div><span class="est-step-clock">${fmtTime(new Date(nowMs + 8*60000))}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 3분 환승</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚇</div>
          <div class="est-step-content"><div><div class="est-step-name">선유도역 9호선 승차장</div><div class="est-step-detail">🚇 9호선 탑승 (4분 이동)</div></div><span class="est-step-clock">${fmtTime(new Date(nowMs + 16*60000))}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 9분 (회사)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node end">🎯</div>
          <div class="est-step-content est-final-step">
            <span class="est-step-name est-final-name">🏢 회사 도착 예정</span>
            <span class="est-step-clock highlight-arr-clock">${fmtClockFull(arrDate)}</span>
          </div>
        </div>
      ` : `
        <div class="est-timeline-step">
          <div class="est-step-node start">🏢</div>
          <div class="est-step-content"><span class="est-step-name">회사 출발</span><span class="est-step-clock">${fmtTime(now)}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 9분 (국회의사당역)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚇</div>
          <div class="est-step-content"><div><div class="est-step-name">국회의사당역 9호선</div><div class="est-step-detail">🚇 9호선 탑승 (4분 이동)</div></div><span class="est-step-clock">${fmtTime(new Date(nowMs + 9*60000))}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 3분 환승</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node">🚌</div>
          <div class="est-step-content"><div><div class="est-step-name">선유도역 버스정류장</div><div class="est-step-detail">🚌 버스 승차 (5분 이동)</div></div><span class="est-step-clock">${fmtTime(new Date(nowMs + 16*60000))}</span></div>
        </div>
        <div class="est-timeline-line"><span class="est-timeline-line-label">🚶 도보 8분 (집)</span></div>
        <div class="est-timeline-step">
          <div class="est-step-node end">🎯</div>
          <div class="est-step-content est-final-step">
            <span class="est-step-name est-final-name">🏠 집 도착 예정</span>
            <span class="est-step-clock highlight-arr-clock">${fmtClockFull(arrDate)}</span>
          </div>
        </div>
      `;

      const detailBox = document.getElementById('commuteEstimationDetailBox');

      box.innerHTML = `
        <div class="est-summary-card est-header-only-card">
          <div class="est-main-header">
            <div class="est-dest-title">
              <span class="est-dest-icon">${isCommute ? '🏢' : '🏠'}</span>
              <div class="est-dest-text">
                <div class="est-dest-label"><span class="est-total-min">${totalMins}분</span> 소요 예상</div>
                <div class="est-dep-time">지금(${fmtTime(now)}) 출발 기준</div>
              </div>
            </div>
            <div class="est-arr-box">
              <span class="est-arr-sub">도착 예정 시각</span>
              <span class="est-arr-time">${fmtClockFull(arrDate)}</span>
            </div>
          </div>
        </div>
      `;

      const detailHtml = `
        <div class="est-summary-card est-detail-timeline-card">
          <div class="est-detail-title-bar">
            <span>🧭 <b>${isCommute ? '출근' : '퇴근'} 이동 경로 및 순차 시각표</b></span>
            <span class="est-detail-badge">도보·환승 연계</span>
          </div>
          <div class="est-timeline-flow">${stepsHtml}</div>
          <div class="est-breakdown-bar">
            <span>💡 총 소요시간 구성: 🚶 도보 20분 + 🚏 대기 ${WAIT_EST}분 + 🚍 승차 9분 = <b>총 ${totalMins}분 소요</b></span>
          </div>
        </div>
      `;

      if (detailBox) {
        detailBox.innerHTML = detailHtml;
      } else {
        box.querySelector('.est-summary-card').insertAdjacentHTML('beforeend', detailHtml);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      renderCards();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function shareKakaoLink() {
      const shareUrl = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showToast('카카오톡 전송용 링크가 복사되었습니다! 💬');
        }).catch(() => {
          prompt('아래 링크를 복사하여 카카오톡에 붙여넣기 하세요:', shareUrl);
        });
      } else {
        prompt('아래 링크를 복사하여 카카오톡에 붙여넣기 하세요:', shareUrl);
      }
    }

    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('.live-cd').forEach(el => {
        const t = parseInt(el.getAttribute('data-time'), 10);
        if (!t || isNaN(t)) return;
        const diffSec = Math.max(0, Math.floor((t - now) / 1000));
        el.innerHTML = formatSec(diffSec);
      });

      // 30초 단위 자동 교정 카운트다운
      if (refreshCountdown > 0) {
        refreshCountdown--;
      }
      if (refreshCountdown <= 0) {
        refreshCountdown = REFRESH_INTERVAL;
        if (!document.hidden && !isFetching) {
          renderCards();
        }
      }
    }, 1000);

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerHTML = `${now.toLocaleTimeString('ko-KR')} <span style="color:#60a5fa; font-weight:700; margin-left:4px;">(교정 ${refreshCountdown}s)</span>`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    let lastResumeFetch = 0;
    const handleAppResume = () => {
      const now = Date.now();
      if (now - lastResumeFetch < 2500) return;
      lastResumeFetch = now;
      refreshCountdown = REFRESH_INTERVAL;
      renderCards();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) handleAppResume();
    });
    window.addEventListener('pageshow', () => {
      handleAppResume();
    });
    window.addEventListener('focus', () => {
      handleAppResume();
    });

    // 사용자 맞춤형 근무표 기반 출/퇴근 모드 자동 초기화
    // - 일근: 전날부터 09시까지 출근모드, 13시부터 퇴근모드
    // - 야근: 당일 07시부터 출근모드
    // - 조근: 당일 05시부터 퇴근모드
    try {
      const overrides = (typeof shiftStorage !== 'undefined') ? shiftStorage.getOverrides() : {};
      const baseSettings = (typeof shiftStorage !== 'undefined') ? shiftStorage.getBaseSettings() : {};
      if (typeof getCommuteModeForDateTime === 'function') {
        currentMode = getCommuteModeForDateTime(new Date(), overrides, baseSettings);
      } else {
        const initHour = new Date().getHours();
        currentMode = (initHour >= 7 && initHour < 13) ? 'commute' : 'offwork';
      }
    } catch (e) {
      console.warn('모드 초기화 실패, 기본 출근모드 적용:', e);
      currentMode = 'commute';
    }
    const tabCommuteEl = document.getElementById('tabCommute');
    const tabOffworkEl = document.getElementById('tabOffwork');
    if (tabCommuteEl && tabOffworkEl) {
      tabCommuteEl.className = `tab-btn ${currentMode === 'commute' ? 'active' : ''}`;
      tabOffworkEl.className = `tab-btn ${currentMode === 'offwork' ? 'active' : ''}`;
    }
    renderCards();
  </script>
</body>
</html>
